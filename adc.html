    var out = [];

<script>

        body.innerHTML = d.supervisors.length ? d.supervisors.map(function (s) {
          return '<div class="panel" data-s="' + esc(s.id) + '"><div class="row" style="justify-content:space-between"><h3 style="margin:0">' + esc(s.name) + ' <span class="ltr" style="color:#5b6472;font-weight:500">@' + esc(s.username) + '</span></h3>' +
            '<select class="s-cat" aria-label="category">' + catOpt(s.category) + '</select></div>' +
            '<label class="f" style="margin-top:10px">' + B('Employees', 'الموظفون') + '</label><div class="chips">' + d.employees.map(function (e) {
              return '<label class="chk"><input type="checkbox" value="' + esc(e.id) + '"' + (s.emps.indexOf(e.id) > -1 ? ' checked' : '') + ' class="s-emp">' + esc(e.name) + '</label>'; }).join('') + '</div>' +
            '<label class="f" style="margin-top:10px">' + B('Responsibilities overseen (none = all)', 'المسؤوليات تحت الإشراف (بلا تحديد = الكل)') + '</label><div class="chips">' + d.resps.map(function (r) {
              return '<label class="chk"><input type="checkbox" value="' + r.code + '"' + (s.scopeResps.indexOf(r.code) > -1 ? ' checked' : '') + ' class="s-resp">' + esc(r.en) + ' · ' + esc(r.ar) + '</label>'; }).join('') + '</div>' +
            '<div class="row" style="margin-top:10px"><button type="button" class="pri s-save">' + B('Save', 'حفظ') + '</button></div><div class="msg s-msg"></div></div>';
        }).join('') : '<div class="panel empty">' + B('No department supervisor accounts yet — the Owner creates them', 'لا حسابات لمشرفي الأقسام بعد — ينشئها المالك') + '</div>';
        body.insertAdjacentHTML('beforeend', respPanel); bindResp();
        if (flash) { var fp = body.querySelector('[data-s="' + flash + '"] .s-msg'); if (fp) msg(fp, B('Saved', 'تم الحفظ'), true); flash = null; }
        body.querySelectorAll('[data-s]').forEach(function (p) {
          p.querySelector('.s-save').onclick = function () {
            var b = this; b.disabled = true;
            var emps = [].slice.call(p.querySelectorAll('.s-emp:checked')).map(function (x) { return x.value; });
            var resps = [].slice.call(p.querySelectorAll('.s-resp:checked')).map(function (x) { return x.value; });
            AuthGate.run('orgSetSupervision', p.dataset.s, emps, resps, p.querySelector('.s-cat').value).then(function () { b.disabled = false; flash = p.dataset.s; load(); })
              .catch(function (e) { b.disabled = false; msg(p.querySelector('.s-msg'), err(e), false); });
          };
        });
      }).catch(function (e) { el.querySelector('.s-body').innerHTML = '<div class="panel msg err">' + err(e) + '</div>'; });
    }
  }

  /* ---------------- Tabs helper ---------------- */
  function tabs(host, list) {
    host.innerHTML = '<div class="ou"><div class="ou-tabs" role="tablist" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' + list.map(function (t, i) {
      return '<button type="button" role="tab" data-t="' + i + '" style="height:40px;padding:0 14px;border:1px solid #dde1e7;border-radius:999px;background:' + (i ? '#fff' : '#0a0a0a') + ';color:' + (i ? '#171b1f' : '#fff') + ';font-family:inherit;font-weight:600;font-size:13px;cursor:pointer">' + t.en + ' · ' + t.ar + '</button>';
    }).join('') + '</div><div class="ou-pane"></div></div>';
    var pane = host.querySelector('.ou-pane'), btns = host.querySelectorAll('[data-t]');
    function show(i) { btns.forEach(function (b, j) { b.style.background = j === i ? '#0a0a0a' : '#fff'; b.style.color = j === i ? '#fff' : '#171b1f'; b.setAttribute('aria-selected', j === i); }); pane.innerHTML = ''; list[i].render(pane); }
    btns.forEach(function (b) { b.onclick = function () { show(+b.dataset.t); }; });
    show(0);
  }

  return { B: B, esc: esc, err: err, msg: msg, monitor: monitor, duty: duty, roster: duty, supervision: supervision, tabs: tabs, iso: iso, loadLib: loadLib };
})();
</script>

<div class="wrap">
  <div class="banner"><div><b>الكابينات الآلية · ADC Cabinets</b><br><small>NUPCO ABC-VEN · 160 items · ADC-01 → ADC-04</small></div><small id="per"></small></div>
  <div id="main"><div class="card muted">Loading · جاري التحميل…</div></div>
  <footer>Pharmacy Tracker by <a href="https://www.linkedin.com/in/waad-alwagdani" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">WaadAlwagdani</a></footer>
</div>
<div id="pick" hidden></div>
<script>
  /* ADC cabinets — Pharmacy Tracker by WaadAlwagdani */
  var D = null, E = function (s) { return OrgUI.esc(s); };
  var ST = { STAT: '🔴 تدخل عاجل · STAT', REORDER: '🟡 تعبئة يومية · Reorder', OK: '🟢 رصيد آمن · OK' };
  var ALERT = { HIGH: '⚠ دواء عالي الخطورة · HIGH-ALERT MEDICATION', CONTROLLED: '🔒 دواء خاضع للرقابة · CONTROLLED DRUG — witness & count required' };
  function load() { return AuthGate.run('adcGet').then(function (d) { D = d; document.getElementById('per').textContent = 'الفترة المفتوحة · Open period: ' + d.period; return d; }); }
  function find(q) { q = String(q || '').trim().toUpperCase(); return D.items.filter(function (x) { return x.code.toUpperCase() === q || x.nupco === q; })[0]; }
  function sar(n) { return (Math.round(n * 100) / 100).toLocaleString('en-US'); }
  // money is optional: an item without a unit cost shows a dash, and totals appear only when costs exist
  function money(q, cost) { return cost ? sar(q * cost) : '—'; }

  /* ---------- 1) Withdraw (nursing) — barcode wedge: scan + Enter opens the drug card ---------- */
  function withdraw(el) {
    el.innerHTML = '<div class="card"><label class="muted" style="display:block;margin-bottom:6px">امسح الباركود أو اكتب اسم الدواء · Scan the barcode or type the drug name</label>' +
      '<input type="search" class="scan" id="w-q" autocomplete="off" placeholder="MED-001 / NUPCO code / name"><div class="sugg" id="w-s" hidden></div></div><div id="w-card"></div>';
    var q = el.querySelector('#w-q'), sg = el.querySelector('#w-s');
    q.focus();
    q.onkeydown = function (e) {
      if (e.key !== 'Enter') return; e.preventDefault();
      var it = find(q.value); if (it) { sg.hidden = true; card(it, true); } else if (q.value.trim()) { msgCard('لا يوجد صنف بهذا الرمز · No item with this code', true); }
    };
    q.oninput = function () {
      var v = q.value.trim().toLowerCase(); if (v.length < 2) { sg.hidden = true; return; }
      var r = D.items.filter(function (x) { return (x.name + ' ' + x.code + ' ' + x.nupco).toLowerCase().indexOf(v) > -1; }).slice(0, 12);
      sg.innerHTML = r.map(function (x) { return '<div data-c="' + E(x.code) + '"><span>' + E(x.name) + '</span><small class="muted">' + E(x.code) + ' · SOH ' + x.soh + '</small></div>'; }).join('');
      sg.hidden = !r.length;
      sg.querySelectorAll('div').forEach(function (d) { d.onclick = function () { sg.hidden = true; card(find(d.dataset.c), false); }; });
    };
    function msgCard(t, bad) { el.querySelector('#w-card').innerHTML = '<div class="card msg ' + (bad ? 'err' : 'ok') + '">' + E(t) + '</div>'; }
    function card(it, scanned) {
      var cl = D.wards.filter(function (w) { return w.adc === it.adc; });
      var h = '<div class="card">' + (it.alert ? '<div class="alert ' + it.alert + '">' + ALERT[it.alert] + '</div>' : '') +
        '<div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="big" dir="ltr">' + E(it.name) + '</div>' +
        '<div class="muted" dir="ltr">' + E(it.code) + ' · NUPCO ' + E(it.nupco) + ' · ' + E(it.abc) + ' · ' + E(it.adc) + '</div></div>' +
        '<div style="text-align:center"><div class="muted">الرصيد في الدرج · Live stock</div><div class="big">' + it.soh + '</div><span class="pill ' + it.status + '">' + ST[it.status] + '</span></div></div>' +
        '<div class="row" style="margin-top:12px"><label>القسم الوجهة · Destination ward<select id="w-ward">' + cl.map(function (w) { return '<option' + (w.ward === it.ward ? ' selected' : '') + '>' + E(w.ward) + '</option>'; }).join('') + '</select></label>' +
        '<label>الكمية · Qty<input type="number" id="w-qty" min="1" max="' + it.soh + '" value="1" style="width:110px"></label>' +
        (scanned ? '<label>نوع السحب · Type<input type="text" value="ممسوح بالباركود · Scanned (BCMA)" disabled style="width:240px"></label>'
          : '<label>سبب السحب الطارئ (مطلوب) · STAT override reason<select id="w-reason"><option value="">—</option>' + D.reasons.map(function (r) { return '<option>' + E(r) + '</option>'; }).join('') + '</select></label>') +
        '<button class="btn" id="w-go">' + (scanned ? 'تأكيد السحب · Confirm' : 'تأكيد سحب طارئ · Confirm override') + '</button></div>' +
        (scanned ? '' : '<div class="muted" style="margin-top:6px">لم يُمسح الباركود، فيُسجَّل السحب كسحب طارئ غير ممسوح ويظهر في تقارير الامتثال. · Not scanned: recorded as an override.</div>') +
        '<div class="msg" id="w-m"></div></div>';
      el.querySelector('#w-card').innerHTML = h;
      var qi = el.querySelector('#w-qty'), go = el.querySelector('#w-go'), m = el.querySelector('#w-m');
      var chk = function () { var n = Number(qi.value); go.disabled = !(n >= 1 && n === Math.floor(n) && n <= it.soh); m.className = 'msg' + (n > it.soh ? ' err' : ''); m.textContent = n > it.soh ? 'الكمية أكبر من الرصيد المتاح في الدرج (' + it.soh + ') · Exceeds stock in the drawer' : ''; };
      qi.oninput = chk; chk(); qi.focus(); qi.select();
      qi.onkeydown = function (e) { if (e.key === 'Enter' && !go.disabled) go.click(); };
      go.onclick = function () {
        var r = scanned ? '' : el.querySelector('#w-reason').value;
        if (!scanned && !r) { m.className = 'msg err'; m.textContent = 'يُرجى اختيار سبب السحب الطارئ · Choose the override reason'; return; }
        go.disabled = true; m.className = 'msg'; m.textContent = '…';
        AuthGate.run('adcWithdraw', it.code, Number(qi.value), el.querySelector('#w-ward').value, scanned, r).then(function (res) {
          it.soh = res.soh; msgCard('✓ ' + res.txId + ' — ' + it.name + ' · الرصيد الآن ' + res.soh, false); q.value = ''; q.focus();
          load();
        }, function (e) { go.disabled = false; m.className = 'msg err'; var c = String(e && e.message || e);
          m.textContent = /ADC_INSUFFICIENT/.test(c) ? 'الرصيد غير كافٍ — المتاح ' + c.split(':')[1] + ' · Not enough stock' : OrgUI.err(e); });
      };
    }
  }

  /* ---------- 2) Daily refill — priority list, confirm refill to Par Max, pick list per cabinet ---------- */
  function refill(el) {
    /* daily refill: every item of the cabinet is listed; the employee enters the quantity actually put in the drawer.
       Items below Par Min come first with the suggested quantity (up to Par Max) already filled in. */
    var CL = 'all', Q = '', ONLY = false, qty = {}, HIT = '';
    function draw() {
      var rows = D.items.filter(function (x) { return CL === 'all' || x.adc === CL; }), n = { STAT: 0, REORDER: 0, OK: 0 };
      rows.forEach(function (x) { n[x.status]++; if (qty[x.code] === undefined && x.status !== 'OK' && x.refill > 0) qty[x.code] = x.refill; });
      var due = rows.filter(function (x) { return x.status !== 'OK'; });
      var list = rows.filter(function (x) { return (!ONLY || x.status !== 'OK') && (!Q || (x.name + ' ' + x.code + ' ' + (x.nupco || '')).toLowerCase().indexOf(Q) > -1); })
        .sort(function (a, b) { var r = { STAT: 0, REORDER: 1, OK: 2 }; return (b.code === HIT) - (a.code === HIT) || r[a.status] - r[b.status] || a.fill - b.fill; });
      var picked = rows.filter(function (x) { return qty[x.code] > 0; }), units = picked.reduce(function (s, x) { return s + qty[x.code]; }, 0);
      el.innerHTML = '<div class="k"><div><b style="color:#b91c1c">' + n.STAT + '</b><span>🔴 تدخل عاجل · STAT</span></div><div><b style="color:#a16207">' + n.REORDER + '</b><span>🟡 تعبئة يومية · Reorder</span></div>' +
        '<div><b style="color:#15803d">' + n.OK + '</b><span>🟢 رصيد آمن · OK</span></div><div><b>' + units + '</b><span>وحدات التعبئة الحالية · Units to add</span></div></div>' +
        '<div class="card"><div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap"><div class="row" style="gap:10px;flex-wrap:wrap"><label>الكابينة · Cabinet<select id="r-cl"><option value="all">كل الكابينات · All</option>' + D.clusters.map(function (c) { return '<option' + (c === CL ? ' selected' : '') + '>' + E(c) + '</option>'; }).join('') + '</select></label>' +
        '<input type="search" id="r-q" placeholder="بحث أو مسح · Search / scan" value="' + E(Q) + '" style="min-width:220px">' +
        '<label style="display:flex;align-items:center;gap:6px;font-weight:600"><input type="checkbox" id="r-only"' + (ONLY ? ' checked' : '') + '> الأصناف التي تحتاج تعبئة فقط</label></div>' +
        '<div class="row"><button class="btn sec" id="r-pick"' + (due.length ? '' : ' disabled') + '>قائمة التجهيز · Pick list</button><button class="btn" id="r-go"' + (picked.length ? '' : ' disabled') + '>تأكيد التعبئة · Confirm refill' + (picked.length ? ' (' + picked.length + ')' : '') + '</button></div></div>' +
        '<div class="tw" style="margin-top:10px"><table><tr><th class="l">الصنف · Item</th><th>الكابينة · ADC</th><th>Par Min</th><th>Par Max</th><th>الرصيد · SOH</th><th>الحالة · Status</th><th>الكمية المُعبّأة · Qty added</th></tr>' +
        (list.length ? list.map(function (x) { return '<tr' + (x.code === HIT ? ' style="background:#fef9c3;outline:2px solid #ca8a04"' : '') + '><td class="l" dir="ltr"><b>' + E(x.name) + '</b> <span class="muted">' + E(x.code) + '</span></td><td class="muted">' + E(x.adc.slice(0, 6)) + '</td><td>' + x.parMin + '</td><td>' + x.parMax + '</td><td><b>' + x.soh + '</b></td>' +
          '<td><span class="pill ' + x.status + '">' + ST[x.status] + '</span></td><td><input type="number" min="0" step="1" inputmode="numeric" data-q="' + E(x.code) + '" value="' + (qty[x.code] > 0 ? qty[x.code] : '') + '" placeholder="0" style="width:100px"></td></tr>'; }).join('')
          : '<tr><td colspan="7" class="muted" style="padding:16px">لا توجد أصناف مطابقة · No matching items</td></tr>') + '</table></div><div class="msg" id="r-m"></div></div>';
      el.querySelector('#r-cl').onchange = function () { CL = this.value; draw(); };
      el.querySelector('#r-only').onchange = function () { ONLY = this.checked; draw(); };
      var rq = el.querySelector('#r-q'); rq.oninput = function () { var p = rq.selectionStart; Q = rq.value.trim().toLowerCase(); draw(); var n2 = el.querySelector('#r-q'); n2.focus(); try { n2.setSelectionRange(p, p); } catch (e) {} };
      /* scan: the scanner types the code then Enter → the cursor jumps to that item's quantity; Enter there → back to the scan box */
      rq.onkeydown = function (ev) {
        if (ev.key !== 'Enter') return; ev.preventDefault();
        var v = rq.value.trim().toLowerCase(); if (!v) return;
        var hit = rows.filter(function (x) { return x.code.toLowerCase() === v || String(x.nupco || '').toLowerCase() === v; })[0];
        if (!hit) { var f = rows.filter(function (x) { return (x.name + ' ' + x.code + ' ' + (x.nupco || '')).toLowerCase().indexOf(v) > -1; }); if (f.length === 1) hit = f[0]; }
        if (!hit) { var mm = el.querySelector('#r-m'); mm.className = 'msg err'; mm.textContent = 'الرمز «' + rq.value.trim() + '» غير موجود في أصناف الكابينة'; rq.select(); return; }
        HIT = hit.code; Q = ''; draw();
        var qi = el.querySelector('input[data-q="' + hit.code.replace(/"/g, '\\"') + '"]'); if (qi) { qi.focus(); qi.select(); qi.scrollIntoView({ block: 'center' }); }
      };
      el.querySelectorAll('input[data-q]').forEach(function (i) {
        var save = function () { qty[i.dataset.q] = Math.max(0, Math.floor(Number(i.value) || 0)); };
        i.onchange = function () { save(); draw(); };
        i.onkeydown = function (ev) { if (ev.key !== 'Enter') return; ev.preventDefault(); save(); i.onchange = null; draw(); var s2 = el.querySelector('#r-q'); s2.focus(); };
      });
      el.querySelector('#r-pick').onclick = function () { pickList(due.map(function (x) { return Object.assign({}, x, { refill: qty[x.code] > 0 ? qty[x.code] : x.refill }); })); };
      var go = el.querySelector('#r-go');
      go.onclick = function () {
        var lines = rows.filter(function (x) { return qty[x.code] > 0; }).map(function (x) { return { code: x.code, qty: qty[x.code] }; }), m = el.querySelector('#r-m');
        go.disabled = true; m.textContent = '…';
        AuthGate.run('adcRefill', lines).then(function (r) { qty = {}; return load().then(function () { draw(); var mm = el.querySelector('#r-m'); mm.className = 'msg ok'; mm.textContent = '✓ سُجّلت تعبئة ' + r.lines + ' صنف (' + r.units + ' وحدة)'; }); },
          function (e) { go.disabled = false; m.className = 'msg err'; m.textContent = OrgUI.err(e); });
      };
    }
    draw();
  }
  function pickList(due) {
    var by = {}; due.forEach(function (x) { (by[x.adc] = by[x.adc] || []).push(x); });
    var p = document.getElementById('pick');
    p.innerHTML = '<div style="padding:24px;font-family:IBM Plex Sans,Arial;color:#000"><h2 style="margin:0">Pick List · قائمة التجهيز من المستودع الرئيسي</h2><div style="font-size:12px;margin-bottom:12px">' + new Date().toLocaleString('en-GB') + ' · Pharmacy Tracker by WaadAlwagdani</div>' +
      Object.keys(by).sort().map(function (k) { return '<h3 style="margin:14px 0 6px">' + E(k) + '</h3><table style="width:100%;border-collapse:collapse;font-size:12px" border="1" cellpadding="5"><tr><th>Code</th><th>NUPCO</th><th>Drug</th><th>SOH</th><th>Par Max</th><th>Qty to pick</th><th>✓</th></tr>' +
        by[k].map(function (x) { return '<tr><td>' + E(x.code) + '</td><td>' + E(x.nupco) + '</td><td>' + E(x.name) + (x.alert ? ' [' + x.alert + ']' : '') + '</td><td>' + x.soh + '</td><td>' + x.parMax + '</td><td><b>' + x.refill + '</b></td><td></td></tr>'; }).join('') + '</table>'; }).join('') + '</div>';
    p.hidden = false; window.print(); setTimeout(function () { p.hidden = true; }, 500);
  }

  /* ---------- 3) Count & monthly zeroing ---------- */
  /* Monthly count: item · physical quantity (any number) · expiry. Approving closes the month and the physical
     count becomes the opening balance of the next month; refills during the month are added on top of it. */
  function count(el) {
    var dr = D.draft || {}, Q = '';
    function draw() {
      var done = D.items.filter(function (x) { return dr[x.code] && dr[x.code].physical !== ''; }).length;
      var rows = D.items.filter(function (x) { return !Q || (x.name + ' ' + x.code).toLowerCase().indexOf(Q) > -1; });
      el.innerHTML = '<div class="k"><div><b>' + done + ' / ' + D.items.length + '</b><span>تم عدّها · Counted</span></div><div><b>' + E(D.period) + '</b><span>الشهر · Month</span></div></div>' +
        '<div class="card"><div class="row" style="justify-content:space-between"><input type="search" id="c-q" placeholder="بحث أو مسح · Search / scan" value="' + E(Q) + '" style="min-width:260px">' +
        '<div class="row"><button class="btn sec" id="c-save">حفظ المسودة · Save draft</button><button class="btn" id="c-ok"' + (done === D.items.length ? '' : ' disabled') + '>اعتماد الجرد وبدء الشهر الجديد · Approve & start new month</button></div></div>' +
        '<div class="muted" style="margin:6px 0 0">يبدأ الشهر الجديد بالعدد الفعلي فقط، وتُضاف عليه التعبئات خلال الشهر. · The new month starts from the physical count only.</div>' +
        '<div class="tw" style="margin-top:10px"><table><tr><th class="l">الدواء · Drug</th><th>الكمية المتوفرة (العدد الفعلي) · Physical qty</th><th>تاريخ الانتهاء · Expiry</th></tr>' +
        rows.map(function (x) { var d = dr[x.code];
          return '<tr><td class="l" dir="ltr"><b>' + E(x.name) + '</b> <span class="muted">' + E(x.code) + '</span></td>' +
            '<td><input type="number" min="0" step="1" inputmode="numeric" data-p="' + E(x.code) + '" value="' + (d ? d.physical : '') + '" style="width:120px"></td>' +
            '<td><input type="month" data-x="' + E(x.code) + '" value="' + E(d && d.expiry || '') + '" style="width:160px"></td></tr>'; }).join('') +
        '</table></div><div class="msg" id="c-m"></div></div>';
      var cq = el.querySelector('#c-q');
      cq.onkeydown = function (e) { if (e.key === 'Enter') { var it = find(cq.value); if (it) { Q = ''; draw(); var i = el.querySelector('input[data-p="' + it.code + '"]'); if (i) { i.scrollIntoView({ block: 'center' }); i.focus(); } } } };
      cq.oninput = function () { Q = cq.value.trim().toLowerCase(); var p = cq.selectionStart; draw(); var n = el.querySelector('#c-q'); n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} };
      el.querySelectorAll('input[data-p]').forEach(function (i) { i.onchange = function () { var c = i.dataset.p; if (i.value === '') delete dr[c]; else dr[c] = { physical: Math.max(0, Math.floor(Number(i.value) || 0)), expiry: (dr[c] && dr[c].expiry) || '' }; draw(); }; });
      el.querySelectorAll('input[data-x]').forEach(function (i) { i.onchange = function () { var c = i.dataset.x; if (!dr[c]) dr[c] = { physical: '', expiry: '' }; dr[c].expiry = i.value; if (dr[c].physical === '') { /* expiry kept until a quantity is entered */ } }; });
      function clean() { var o = {}; Object.keys(dr).forEach(function (c) { if (dr[c].physical !== '' && dr[c].physical !== undefined) o[c] = dr[c]; }); return o; }

      '</tr></thead><tbody>' +
        rows.map(function (r) {
          return '<tr>' + r.map(function (c) { return '<td>' + E(c) + '</td>'; }).join('') + '</tr>';
        }).join('') +
      '</tbody></table>' +
      '<table class="sigs"><tr>' +
        '<td>إعداد: ' + E(meta.by || TECH.name) + '<br><br>____________________</td>' +
        '<td>مراجعة الصيدلية<br><br>____________________</td>' +
        '<td>الاعتماد<br><br>____________________</td>' +
      '</tr></table>' +
      '</body></html>';

    if (format === 'word') {
      var blob = new Blob(['\ufeff' + docHtml], { type: 'application/msword;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = (meta.fileName || 'report') + '.doc';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } else {
      var win = window.open('', '_blank', 'width=960,height=720');
      if (!win) return;
      win.document.open();
      win.document.write(docHtml);
      win.document.close();
      win.focus();
      setTimeout(function () { win.print(); }, 300);
    }
  }

  /* ---------- تذكير الجرد الشهري (من يوم 28 حتى اكتمال جرد جميع الأقسام) ---------- */
  function shouldShowCountReminder() {
    if (TECH.reminderDismissed || !TECH.canCount) return false;
    var n = new Date(), cur = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');
    return TECH.period < cur || n.getDate() >= 28;
  }

  /* expiry picker: month list + year list (value MM/YYYY) */
  function expSel(key, val) {
    var m = /^(\d{1,2})\/(\d{4})$/.exec(String(val || '')), mm = m ? ('0' + m[1]).slice(-2) : '', yy = m ? m[2] : '', y0 = new Date().getFullYear(), ys = [];
    for (var y = y0 - 1; y <= y0 + 8; y++) ys.push(String(y));
    if (yy && ys.indexOf(yy) === -1) ys.push(yy);
    return '<span class="exp-sel" data-exp="' + E(key) + '" style="display:inline-flex;gap:6px;direction:ltr">' +
      '<select data-em style="width:84px"><option value="">MM</option>' + MONTHS_12.map(function (x) { return '<option value="' + x.num + '"' + (x.num === mm ? ' selected' : '') + '>' + x.num + '</option>'; }).join('') + '</select>' +
      '<select data-ey style="width:96px"><option value="">YYYY</option>' + ys.map(function (y) { return '<option' + (y === yy ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select></span>';
  }
  function expVal(box) { var m = box.querySelector('[data-em]').value, y = box.querySelector('[data-ey]').value; return m && y ? m + '/' + y : ''; }
  function expBind(fn) { document.querySelectorAll('.exp-sel').forEach(function (b) { b.querySelectorAll('select').forEach(function (x) { x.onchange = function () { fn(b.dataset.exp, expVal(b)); }; }); }); }

  function bindHome() {
    document.querySelectorAll('[data-ht]').forEach(function (b) {
      b.onclick = function () { homeTab = b.dataset.ht; previewReqId = ''; activeTaskId = ''; render(); };
    });
    document.querySelectorAll('[data-prev]').forEach(function (btn) {
      btn.onclick = function () { previewReqId = btn.dataset.prev; editModeForReq = ''; activeTaskId = ''; render(); };
    });
    document.querySelectorAll('[data-task]').forEach(function (card) {
      card.onclick = function () { activeTaskId = card.dataset.task; previewReqId = ''; editModeForReq = ''; render(); };
    });

    if (previewReqId) {
      var pr = findReq(previewReqId);
      var exportPr = function (fmt) {
        exportReport(fmt,
          { title: 'طلب تموين قسم ' + pr.ward, ref: pr.id, ward: pr.ward, fileName: 'Order_' + pr.id },
          ['#', 'الرقم التشغيلي', 'اسم الصنف', 'التركيز', 'الشكل الدوائي', 'الكمية المطلوبة'],
          pr.items.map(function (it, i) { return [i + 1, it.stockNo, it.name, it.strength, it.form, it.reqQty]; })
        );
      };
      document.getElementById('pr-pdf').onclick = function () { exportPr('pdf'); };
      document.getElementById('pr-word').onclick = function () { exportPr('word'); };
      document.getElementById('pr-close').onclick = function () { previewReqId = ''; editModeForReq = ''; render(); };

      var accBtn = document.getElementById('pr-accept-btn');
      if (accBtn) accBtn.onclick = function () { accBtn.disabled = true; var id = pr.id; AuthGate.run('wardSetStatus', id, 'Preparing').then(function () { homeTab = 'tasks'; previewReqId = ''; editModeForReq = ''; activeTaskId = id; return techLoad().then(render); }, function (e) { accBtn.disabled = false; alert(OrgUI.err(e)); }); };
      var edBtn = document.getElementById('pr-edit-btn');
      if (edBtn) edBtn.onclick = function () { editModeForReq = pr.id; render(); };
      var edCancel = document.getElementById('pr-edit-cancel');
      if (edCancel) edCancel.onclick = function () { editModeForReq = ''; render(); };
      var edSend = document.getElementById('pr-edit-send');
      if (edSend) edSend.onclick = function () {
        var txt = document.getElementById('pr-edit-txt').value.trim();
        if (!txt) { document.getElementById('pr-edit-txt').focus(); return; }
        pr.returnNote = txt; pr.status = 'returned'; previewReqId = ''; editModeForReq = ''; render();
      };
    }

    if (activeTaskId) {
      var tk = findReq(activeTaskId);
      var exportTk = function (fmt) {
        exportReport(fmt,
          { title: 'تجهيز طلب قسم ' + tk.ward, ref: tk.id, ward: tk.ward, fileName: 'Prepared_' + tk.id },
          ['#', 'الرقم التشغيلي', 'اسم الصنف', 'التركيز', 'الشكل الدوائي', 'الكمية المطلوبة', 'الكمية المجهزة', 'ملاحظات'],
          tk.items.map(function (it, i) {
            var pv = String(it.prepQty == null ? '' : it.prepQty).trim();
            return [i + 1, it.stockNo, it.name, it.strength, it.form, it.reqQty, (pv === '' || Number(pv) <= 0) ? 'N/A' : pv, it.note || '—'];
          })
        );
      };
      document.getElementById('tk-pdf').onclick = function () { exportTk('pdf'); };
      document.getElementById('tk-word').onclick = function () { exportTk('word'); };
      document.getElementById('tk-close').onclick = function () { activeTaskId = ''; render(); };

      document.querySelectorAll('input[data-tkq]').forEach(function (inp) {
        inp.oninput = function () {
          var i = Number(inp.dataset.tkq);
          tk.items[i].prepQty = inp.value;
          var badge = document.querySelector('[data-nab="' + i + '"]');
          var v = inp.value.trim();
          if (badge) badge.style.display = (v === '' || Number(v) <= 0) ? 'inline-block' : 'none';
        };
      });
      document.querySelectorAll('select[data-tks]').forEach(function (sel) {
        sel.onchange = function () {
          var i = Number(sel.dataset.tks);
          if (sel.value) {
            tk.items[i].note = sel.value;
            var nInp = document.querySelector('input[data-tkn="' + i + '"]');
            if (nInp) nInp.value = sel.value;
          }
        };
      });
      document.querySelectorAll('input[data-tkn]').forEach(function (inp) {
        inp.oninput = function () { tk.items[Number(inp.dataset.tkn)].note = inp.value; };
      });
      document.getElementById('tk-finish').onclick = function () {
        var b = document.getElementById('tk-finish'); b.disabled = true;
        AuthGate.run('wardSetStatus', tk.id, 'Ready').then(function () { activeTaskId = ''; return techLoad().then(render); }, function (e) { b.disabled = false; alert(OrgUI.err(e)); });
      };
    }
  }

  function buildRefill() {
    var selKeys = Object.keys(RF.selectedWards);
    var allSelected = selKeys.length === TECH.wards.length;

  function bindRefill() {
    if (RF.step === 1) {
      var itemIn = document.getElementById('rf-item'), expBox = document.querySelector('.exp-sel[data-exp="rf"]');
      itemIn.oninput = function () {
        RF.itemName = itemIn.value; RF.msg = '';
        var match = TECH.items.filter(function (x) { return x.name === RF.itemName; })[0];
        if (match && !expVal(expBox) && match.nearestExp) { var mm = /^(\d{1,2})\/(\d{4})$/.exec(match.nearestExp); if (mm) { expBox.querySelector('[data-em]').value = ('0' + mm[1]).slice(-2); var ys = expBox.querySelector('[data-ey]'); ys.value = mm[2]; RF.expiry = expVal(expBox); } }
      };
      expBind(function (k, v) { RF.expiry = v; });
      document.getElementById('rf-next').onclick = function () {
        RF.itemName = itemIn.value.trim(); RF.expiry = expVal(expBox);
        if (!RF.itemName) { itemIn.focus(); return; }
        RF.step = 2; render();
      };
      return;
    }
    document.querySelectorAll('[data-rfw]').forEach(function (box) {
      box.onclick = function (e) {
        if (e.target && e.target.tagName === 'INPUT') return;
        var w = box.dataset.rfw;
        if (Object.prototype.hasOwnProperty.call(RF.selectedWards, w)) delete RF.selectedWards[w];
        else RF.selectedWards[w] = '';
        render();
        var inp = document.querySelector('input[data-wqty="' + w + '"]');
        if (inp) inp.focus();
      };
    });
    document.querySelectorAll('input[data-wqty]').forEach(function (inp) { inp.oninput = function () { RF.selectedWards[inp.dataset.wqty] = inp.value; }; });
    document.getElementById('rf-all').onclick = function () {
      var selKeys = Object.keys(RF.selectedWards);
      if (selKeys.length === TECH.wards.length) RF.selectedWards = {};
      else TECH.wards.forEach(function (w) { if (!Object.prototype.hasOwnProperty.call(RF.selectedWards, w)) RF.selectedWards[w] = ''; });
      render();
    };
    document.getElementById('rf-repeat').onclick = function () {
      var ordered = TECH.wards.filter(function (w) { return Object.prototype.hasOwnProperty.call(RF.selectedWards, w); });
      if (ordered.length < 2) return;
      var firstVal = '';
      for (var i = 0; i < ordered.length; i++) { var v = String(RF.selectedWards[ordered[i]] || '').trim(); if (v !== '') { firstVal = v; break; } }
      if (!firstVal) { document.getElementById('rf-err').textContent = 'أدخل العدد في أول قسم أولاً'; return; }
      ordered.forEach(function (w) { RF.selectedWards[w] = firstVal; });
      render();
    };
    document.getElementById('rf-back').onclick = function () { RF.step = 1; render(); };
    document.getElementById('rf-done').onclick = function () {
      var chosen = TECH.wards.filter(function (w) { return Object.prototype.hasOwnProperty.call(RF.selectedWards, w); });
      var valid = [];
      chosen.forEach(function (w) { var q = Math.floor(Number(RF.selectedWards[w])); if (q > 0) valid.push({ ward: w, qty: q }); });
      if (!valid.length) { document.getElementById('rf-err').textContent = 'أدخل عدداً صحيحاً'; return; }
      var match = TECH.items.filter(function (x) { return x.name === RF.itemName; })[0];
      if (!match) { document.getElementById('rf-err').textContent = 'يُختار الصنف من القائمة'; return; }
      var btn = document.getElementById('rf-done'); btn.disabled = true; btn.textContent = '…';
      var doneName = RF.itemName;
      AuthGate.run('adcRefill', valid.map(function (v) { return { code: match.code, qty: v.qty, ward: v.ward }; })).then(function (r) {
        RF.step = 1; RF.itemName = ''; RF.expiry = ''; RF.selectedWards = {};
        RF.msg = 'تم · ' + doneName + ' (' + valid.length + ' أقسام · ' + r.units + ')';
        return techLoad().then(render);
      }, function (e) { btn.disabled = false; btn.textContent = 'تم'; document.getElementById('rf-err').textContent = OrgUI.err(e); });
    };
  }

          '<div class="btn-group">' +

          '</div>' +

          '<tr><th>الرقم التشغيلي</th><th class="r">اسم الدواء</th><th>التركيز</th><th>الشكل الدوائي</th><th>الكمية المتوفرة</th><th>تاريخ الانتهاء</th></tr>' +
          rows.map(function (x) {
            var realIdx = TECH.items.indexOf(x), dr = TECH.countDraft[x.code] || {}, has = dr.physical !== undefined;
            return '<tr class="' + (has ? 'done' : '') + '">' +

  function bindCount(foot) {
    foot.hidden = false;
    var done = TECH.items.filter(function (x) { return TECH.countDraft[x.code] && TECH.countDraft[x.code].physical !== undefined; }).length;
    foot.innerHTML =
      '<div class="foot-in">' +
        '<span class="msg ok" id="cnt-status">' + (lastSavedAt || '') + '</span>' +
        '<div class="btn-group">' +
          '<button class="btn sec" id="cnt-save">حفظ المسودة</button>' +

        '</div>' +
      '</div>';

    var exportCnt = function (fmt) {
      exportReport(fmt,
        { title: 'الجرد الشهري · ' + monthLabel(TECH.period), ref: TECH.period, ward: TECH.wards.join('، '), fileName: 'MonthlyCount_' + TECH.period },
        ['#', 'الرقم التشغيلي', 'اسم الدواء', 'التركيز', 'الشكل الدوائي', 'الكمية المتوفرة', 'تاريخ الانتهاء'],
        TECH.items.map(function (x, i) {
          var dr = TECH.countDraft[x.code] || {};
          return [i + 1, x.code, x.name, x.strength || '—', x.form || '—', dr.physical !== undefined ? dr.physical : '—', dr.expiry || '—'];
        })
      );
    };
    document.getElementById('cnt-pdf').onclick = function () { exportCnt('pdf'); };
    document.getElementById('cnt-word').onclick = function () { exportCnt('word'); };

    var cur = TECH.items[countFocus] || TECH.items[0];
    function setPhys(code, val) {
      if (val === '' || val === null || isNaN(val) || val < 0) delete TECH.countDraft[code];
      else TECH.countDraft[code] = { physical: Math.floor(Number(val)), expiry: (TECH.countDraft[code] && TECH.countDraft[code].expiry) || '' };
      lastSavedAt = getGregorianNow().time;
    }
    function setExp(code, exp) {
      var v = String(exp || '').trim();
      if (v) lastExpiry = v;
      if (!TECH.countDraft[code]) TECH.countDraft[code] = { physical: undefined, expiry: v };
      else TECH.countDraft[code].expiry = v;
      lastSavedAt = getGregorianNow().time;
    }

    }
    expBind(function (code, v) { setExp(code, v); render(); });
    if (document.getElementById('q-zero')) document.getElementById('q-zero').onclick = function () { setPhys(cur.code, 0); render(); };
    if (document.getElementById('q-plus5')) document.getElementById('q-plus5').onclick = function () { setPhys(cur.code, ((TECH.countDraft[cur.code] && TECH.countDraft[cur.code].physical) || 0) + 5); render(); };
    if (document.getElementById('q-plus10')) document.getElementById('q-plus10').onclick = function () { setPhys(cur.code, ((TECH.countDraft[cur.code] && TECH.countDraft[cur.code].physical) || 0) + 10); render(); };
    if (document.getElementById('q-last-exp')) document.getElementById('q-last-exp').onclick = function () { setExp(cur.code, lastExpiry); render(); };
    if (document.getElementById('fc-prev')) document.getElementById('fc-prev').onclick = function () { if (countFocus > 0) { countFocus--; render(); } };
    if (document.getElementById('fc-next')) document.getElementById('fc-next').onclick = function () { countFocus = countFocus < TECH.items.length - 1 ? countFocus + 1 : 0; render(); };

    var cq = document.getElementById('cnt-q');
    cq.oninput = function () { countSearch = cq.value.trim().toLowerCase(); var p = cq.selectionStart; render(); var n = document.getElementById('cnt-q'); n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} };
    document.querySelectorAll('[data-sel]').forEach(function (td) { td.onclick = function () { countFocus = Number(td.dataset.sel); showFocusBox = true; render(); }; });
    document.querySelectorAll('input[data-cp]').forEach(function (inp) { inp.onchange = function () { setPhys(inp.dataset.cp, inp.value.trim() === '' ? '' : Number(inp.value)); render(); }; });


    document.getElementById('cnt-save').onclick = function () {
      var st = document.getElementById('cnt-status'); st.className = 'msg'; st.textContent = '…';
      techSave().then(function (r) { lastSavedAt = 'محفوظ (' + r.saved + ') · ' + getGregorianNow().time; st.className = 'msg ok'; st.textContent = lastSavedAt; },
        function (e) { st.className = 'msg err'; st.textContent = OrgUI.err(e); });
    };
    document.getElementById('cnt-approve').onclick = function () {
      var btn = document.getElementById('cnt-approve');
      if (!btn.dataset.ok) {
        btn.dataset.ok = '1'; btn.textContent = 'تأكيد الاعتماد';
        confirmZero = setTimeout(function () { delete btn.dataset.ok; btn.textContent = 'اعتماد'; }, 5000);
        return;
      }
      clearTimeout(confirmZero); delete btn.dataset.ok; btn.disabled = true;
      var st = document.getElementById('cnt-status'); st.className = 'msg'; st.textContent = '…';

        lastSavedAt = 'تم اعتماد جرد ' + r.closed; selectedYear = r.closed.slice(0, 4); selectedMonthNum = r.closed.slice(5); countFocus = 0;
        return techLoad().then(render);

    };
  }

        exportReport(fmt,
          { title: 'جرد قسم ' + selectedWardRecord, ref: ym, ward: selectedWardRecord, period: monthLabel(ym), by: monthRecord.by, fileName: 'Ward_' + selectedWardRecord + '_' + ym },
          ['#', 'الرقم التشغيلي', 'اسم الدواء', 'التركيز', 'الشكل الدوائي', 'الكمية', 'الانتهاء'],
          wRows.map(function (r, i) { return [i + 1, r.code, r.name, r.strength || 'n/a', r.unit || '', r.physical, r.expiry]; })
        );
      };
      var rPdf = document.getElementById('rec-pdf');
      var rWord = document.getElementById('rec-word');
      if (rPdf) rPdf.onclick = function () { exportRec('pdf'); };
      if (rWord) rWord.onclick = function () { exportRec('word'); };
    }
  }


  /* ---------- data from the server (ADC technician) ---------- */
  function ymToMmYyyy(v) { var m = /^(\d{4})-(\d{2})$/.exec(String(v || '')); return m ? m[2] + '/' + m[1] : ''; }
  function mmYyyyToYm(v) { var m = /^(\d{1,2})\/(\d{4})$/.exec(String(v || '').trim()); return m ? m[2] + '-' + String(m[1]).padStart(2, '0') : ''; }
  /* ward requests (floor stock / crash cart) of this technician's wards: New → pending, Preparing → my task, Ready/Delivered → done */
  function techReqs(w, d) {
    if (!w || !w.rows) return [];
    var mine = (d.wards || []).map(function (x) { return String(x.ward).toLowerCase(); });
    var rows = w.rows.filter(function (r) { return r.status !== 'Cancelled'; });
    var hit = rows.filter(function (r) { return mine.indexOf(String(r.dept).toLowerCase()) > -1; });
    if (hit.length || !mine.length) rows = hit.length ? hit : rows;
    var ST = { New: 'pending', Preparing: 'task', Ready: 'done', Delivered: 'done' };
    return rows.map(function (r) { var at = String(r.at || '');
      return { id: r.id, ward: r.dept, date: at.slice(0, 10), time: at.slice(11, 16), status: ST[r.status] || 'done', returnNote: '', srv: r.status,
        items: (r.items || []).map(function (it) { return { stockNo: it.no || '', name: it.name, strength: it.strength || 'n/a', form: it.form || '', reqQty: it.qty, prepQty: '', note: '' }; }) }; });
  }
  function techBuild(d, x, w) {
    var dr = {}; Object.keys(d.draft || {}).forEach(function (c) { var k = d.draft[c]; dr[c] = { physical: k.physical === '' ? undefined : k.physical, expiry: ymToMmYyyy(k.expiry) }; });
    var byCode = {}; d.items.forEach(function (i) { byCode[i.code] = i; });
    var hist = [], recs = {};
    (x && x.tx || []).forEach(function (r) {
      if (String(r[4]) !== 'RECEIVED' || String(r[2]) !== d.period || !byCode[String(r[5])]) return;
      hist.unshift({ time: String(r[1]).slice(11, 16), period: String(r[2]), ward: String(r[8] || ''), item: String(r[6]), qty: Number(r[11]) || 0, exp: '—', by: String(r[9] || '') });
    });
    (x && x.counts || []).forEach(function (c) {
      var it = byCode[String(c[1])]; if (!it) return;
      var mo = String(c[0]), rec = recs[mo] || (recs[mo] = { by: String(c[11] || '').replace(/\s*\(@.*$/, ''), wards: {} });
      (rec.wards[it.ward] = rec.wards[it.ward] || []).push({ code: it.code, name: it.name, cat: it.abc || '', strength: it.strength || '', physical: Number(c[7]) || 0, unit: it.form || '', expiry: '—' });
    });
    var nm = String(d.me || '');
    return { loggedIn: true, name: nm, initials: nm.split(' ').slice(0, 2).map(function (s) { return s.charAt(0); }).join(' '), id: '', role: 'فني صيدلية',
      period: d.period, cabinet: (d.clusters || []).map(function (c) { return c.split(' ')[0]; }).join(' · '),
      wards: (d.wards || []).map(function (w) { return w.ward; }), canCount: !!(d.perms && d.perms.count), reminderDismissed: TECH ? TECH.reminderDismissed : false,
      completedCountPeriods: {}, previewReminder: false,
      items: d.items.map(function (i) { return { code: i.code, name: i.name, cat: i.abc || '', strength: i.strength || '', form: i.form || '', ward: i.ward, stock: i.soh, nearestExp: (dr[i.code] && dr[i.code].expiry) || '' }; }),
      requests: techReqs(w, d), reqNote: w && w.err ? w.err : '', refillHistory: hist, countDraft: dr, recordsByMonth: recs };
  }
  function techLoad() {
    return Promise.all([AuthGate.run('adcGet'), AuthGate.run('adcExport').catch(function () { return null; }), AuthGate.run('wardQueue').catch(function (e) { return { err: OrgUI.err(e) }; })]).then(function (r) { D = r[0]; TECH = techBuild(r[0], r[1], r[2]); });
  }
  function techSave() {
    var out = {}; TECH.items.forEach(function (x) { var k = TECH.countDraft[x.code]; out[x.code] = { physical: k && k.physical !== undefined ? k.physical : '', expiry: k ? mmYyyyToYm(k.expiry) : '' }; });
    return AuthGate.run('adcCountSave', out);
  }
  function techStart() {
    var st = document.createElement('style'); st.textContent = TECH_CSS + '\n.tk-nav{display:flex!important;flex-direction:row!important;gap:6px;flex-wrap:wrap;margin:0 0 14px}.tk-nav .s-btn{width:auto}.banner{display:none!important}#tk-foot{position:sticky;bottom:0}#pr-edit-btn{display:none!important}';
    document.head.appendChild(st);
    if (!document.getElementById('modal-host')) { var mh = document.createElement('div'); mh.id = 'modal-host'; document.body.appendChild(mh); }
    if (!document.getElementById('tk-foot')) { var f = document.createElement('div'); f.id = 'tk-foot'; f.className = 'foot'; f.hidden = true; document.getElementById('main').after(f); }
    var n = new Date(); selectedYear = String(n.getFullYear()); selectedMonthNum = String(n.getMonth() + 1).padStart(2, '0');
    return techLoad().then(function () { render(); setInterval(function () { try { updateClockDom(); } catch (e) {} }, 30000); });
  }

  return { start: techStart };
})();

  AuthGate.start({ accent: '#1c1c1c', bg: '#f6f5f2', barWidth: '1180px', page: 'adc', onReady: function () {
    var main = document.getElementById('main');
    load().then(function (d) {
      if (d.perms.refill && !d.perms.sup) { main.innerHTML = ''; TECHUI.start().catch(function (e) { main.innerHTML = '<div class="card msg err">' + OrgUI.err(e) + '</div>'; }); return; }
      var tabs = [];
      if (d.perms.withdraw) tabs.push({ en: 'Withdraw', ar: 'السحب', render: withdraw });
      if (d.perms.refill) tabs.push({ en: 'Daily refill', ar: 'التعبئة اليومية', render: refill });
      if (d.perms.count) tabs.push({ en: 'Count & zeroing', ar: 'الجرد والتصفير', render: count });
      if (d.perms.sup) tabs.push({ en: 'Supervisor view', ar: 'لوحة المشرف', render: sup });
      if (d.scoped) { var bs = document.querySelector('.banner small'); if (bs) bs.textContent = d.clusters.length ? 'كابيناتك · Your cabinets: ' + d.clusters.join(' · ') : ''; }
      if (d.scoped && !d.clusters.length) { main.innerHTML = '<div class="card msg err">لم تُسند إليك أي كابينة بعد — يُرجى مراجعة المشرف · No cabinet assigned to you yet</div>'; return; }
      if (!tabs.length) { main.innerHTML = '<div class="card msg err">لا توجد صلاحية على الكابينات · No ADC permission</div>'; return; }
      OrgUI.tabs(main, tabs);
      countReminder(d, tabs);
    }, function (e) { main.innerHTML = '<div class="card msg err">' + (/ADC_NOT_INSTALLED/.test(String(e && e.message)) ? 'وحدة الكابينات غير مثبّتة — يُرجى تشغيل adcInstall من المحرر' : OrgUI.err(e)) + '</div>'; });
  } });
</script>
