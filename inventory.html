<style>
  :root{--ink:#0a0a0a;--muted:#71717a;--paper:#f4f4f5;--panel:#fff;--line:#d3dde3;--acc:#0a0a0a;--acc-t:#e3f0f6;--red:#a3231b;--red-t:#f8e9e8;--amber:#9a6200;--amber-t:#fbf1dc;--green:#276b3e;--green-t:#e6f1ea}

    var stored = null; try { stored = localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch (e) {}

  /** Opens another page the account may see (server checks the role), with a "home" chip for supervisors. */
  function open(page, opts) {

})();

  function fmtExp(k){var p=String(k).split('-');return p.length===2?(+p[1])+'/'+p[0]:k;}
  function monthsLeft(k){var p=k.split('-'),t=D.today.split('-');return (+p[0]-+t[0])*12+(+p[1]-+t[1]);}
  function errText(e){var m=String(e&&e.message||'');return m.replace(/^Exception:\s*/,'')||'يُرجى المحاولة مرة أخرى';}
  function byNo(no){return D.items.filter(function(i){return i.no===no;})[0];}
  function onHand(no){return D.batches.filter(function(b){return b.no===no;}).reduce(function(s,b){return s+b.qty;},0);}
  function msg(id,t,ok){var m=$(id);m.className='msg '+(ok?'ok':'err');m.textContent=t;}

  function auto(inp,box,pick){
    var list=[],idx=-1;
    function show(){var q=inp.value.trim().toLowerCase();list=q?D.items.filter(function(d){return d.name.toLowerCase().indexOf(q)>-1||d.no===q;}).slice(0,10):[];idx=-1;
      if(!list.length){box.hidden=true;return;}
      box.innerHTML=list.map(function(d,i){return '<div data-i="'+i+'"><span>'+esc(d.name)+'</span><small>'+esc(d.strength)+' · #'+esc(d.no)+'</small></div>';}).join('');box.hidden=false;
      box.querySelectorAll('div').forEach(function(el){el.onmousedown=function(ev){ev.preventDefault();pick(list[+el.dataset.i]);box.hidden=true;};});}
    inp.addEventListener('input',show);inp.addEventListener('blur',function(){setTimeout(function(){box.hidden=true;},150);});
    inp.addEventListener('keydown',function(ev){if(box.hidden)return;
      if(ev.key==='ArrowDown')idx=Math.min(idx+1,list.length-1);else if(ev.key==='ArrowUp')idx=Math.max(idx-1,0);
      else if(ev.key==='Enter'){ev.preventDefault();pick(list[Math.max(idx,0)]);box.hidden=true;return;}else return;
      box.querySelectorAll('div').forEach(function(el,i){el.classList.toggle('on',i===idx);});});
  }

  /* ---------- Balance ---------- */
  function renderBal(){
    $('app').innerHTML='<div class="card"><input type="text" id="bq" placeholder="البحث باسم الصنف أو رقمه" autocomplete="off" style="direction:ltr;text-align:left">'+
      '<div class="chips"><button class="chip" data-f="all">الكل</button><button class="chip" data-f="low">تحت الحد</button><button class="chip" data-f="zero">بلا رصيد</button></div></div>'+
      '<div class="card" id="bl"></div>';
    $('bq').value=Q;$('bq').addEventListener('input',function(){Q=this.value;list();});
    document.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c.dataset.f===FILTER);c.onclick=function(){FILTER=c.dataset.f;renderBal();};});
    list();
  }
  function list(){
    var q=Q.trim().toLowerCase();
    var rows=D.items.map(function(it){var h=onHand(it.no),mn=D.mins[it.no]||0;return{it:it,h:h,mn:mn,low:mn>0&&h<mn};})
      .filter(function(r){if(q&&r.it.name.toLowerCase().indexOf(q)<0&&r.it.no!==q)return false;
        if(FILTER==='low')return r.low;if(FILTER==='zero')return r.h===0;return true;})
      .sort(function(a,b){return (b.low-a.low)||a.it.name.localeCompare(b.it.name);});
    var shown=rows.slice(0,80);
    $('bl').innerHTML=shown.length?shown.map(function(r){
      var tag=r.low?'<span class="tag t-red">تحت الحد</span>':(r.h===0?'<span class="tag t-amb">بلا رصيد</span>':'');
      return '<div class="item" data-no="'+esc(r.it.no)+'"><div class="top"><div><div class="nm ltr">'+esc(r.it.name)+'</div><div class="st"><span class="ltr">'+esc(r.it.strength)+'</span> · #'+esc(r.it.no)+
        ' · '+(r.it.group==='unit'?'Unit Dose':'Pharmacy Items')+tag+'</div></div><div class="qty">'+r.h+'</div></div>'+(OPEN===r.it.no?detail(r):'')+'</div>';
    }).join('')+(rows.length>80?'<div class="note">يظهر أول ٨٠ من '+rows.length+' — للبقية يُستخدم البحث.</div>':''):'<div class="empty">لا توجد أصناف مطابقة</div>';
    $('bl').querySelectorAll('.item .top').forEach(function(el){el.onclick=function(){var no=el.parentNode.dataset.no;OPEN=OPEN===no?null:no;list();};});
    var sv=$('minsave');if(sv)sv.onclick=function(){
      sv.disabled=true;AuthGate.run('invSetMin',OPEN,$('minin').value).then(function(r){D.mins[OPEN]=r.min;list();})
        .catch(function(e){sv.disabled=false;$('minerr').textContent=errText(e);});};
  }
  function detail(r){
    var bs=D.batches.filter(function(b){return b.no===r.it.no;}).sort(function(a,b){return a.exp<b.exp?-1:1;});
    return '<div class="det">'+(bs.length?'<table><tr><th>التشغيلة</th><th>الانتهاء</th><th>الكمية</th></tr>'+bs.map(function(b){
      return '<tr><td class="ltr">'+esc(b.lot)+'</td><td>'+fmtExp(b.exp)+'</td><td>'+b.qty+'</td></tr>';}).join('')+'</table>':'<div class="st">لا توجد تشغيلات في المخزون</div>')+
      (RO?'<div class="st" style="margin-top:8px">حد إعادة الطلب: '+(r.mn||'—')+'</div></div>':
      '<div class="minrow"><label class="l" for="minin" style="margin:0">حد إعادة الطلب</label><input type="number" id="minin" min="0" step="1" value="'+r.mn+'" inputmode="numeric">'+
      '<button class="btn2" id="minsave" type="button">حفظ</button></div><div class="st" id="minerr" style="color:var(--red)"></div></div>');
  }

  /* ---------- Receive ---------- */
  var RROWS=[];
  function renderRcv(){
    $('app').innerHTML='<div class="card"><div id="rrows"></div><button class="add" id="radd" type="button">+ إضافة صنف</button>'+
      '<label class="l" for="rnote">ملاحظة (رقم طلب المستودع مثلاً)</label><input type="text" id="rnote" maxlength="120"></div>'+
      '<button class="btn" id="rgo" type="button">تسجيل الاستلام</button><div class="msg" id="rmsg" role="status"></div>';
    RROWS=[];addR();$('radd').onclick=addR;$('rgo').onclick=sendR;
  }
  function addR(){
    var r={it:null};RROWS.push(r);var el=document.createElement('div');el.className='row';
    el.innerHTML='<div class="field"><input type="text" placeholder="اسم الصنف" autocomplete="off" style="direction:ltr;text-align:left" aria-label="الصنف"><div class="sugg" hidden></div><div class="chosen ltr"></div></div>'+
      '<input type="text" class="lot" placeholder="رقم التشغيلة" maxlength="30" autocapitalize="characters" style="direction:ltr" aria-label="رقم التشغيلة">'+
      '<input type="month" class="exp" aria-label="تاريخ الانتهاء"><input type="number" class="q" min="1" step="1" placeholder="الكمية" inputmode="numeric" aria-label="الكمية">'+
      '<button class="x" type="button" aria-label="حذف">×</button>';
    $('rrows').appendChild(el);r.el=el;
    var di=el.querySelector('input'),ch=el.querySelector('.chosen');
    auto(di,el.querySelector('.sugg'),function(d){r.it=d;di.value=d.name;ch.textContent='✓ '+nm(d)+' · #'+d.no;el.querySelector('.lot').focus();});
    di.addEventListener('input',function(){r.it=null;ch.textContent='';});
    el.querySelector('.x').onclick=function(){if(RROWS.length===1)return;RROWS=RROWS.filter(function(x){return x!==r;});el.remove();};
  }
  function sendR(){
    var rows=[],bad=false;
    RROWS.forEach(function(r){var lot=r.el.querySelector('.lot').value.trim(),exp=r.el.querySelector('.exp').value,q=parseInt(r.el.querySelector('.q').value,10);
      if(!r.it&&!lot&&!exp&&!q)return;if(!r.it||!lot||!/^\d{4}-\d{2}$/.test(exp)||!(q>0)){bad=true;return;}
      rows.push({drugNo:r.it.no,lot:lot,exp:exp,qty:q});});
    if(bad)return msg('rmsg','يلزم اختيار كل صنف من القائمة وإدخال التشغيلة والانتهاء والكمية',false);
    if(!rows.length)return msg('rmsg','يلزم إضافة صنف واحد على الأقل',false);
    var b=$('rgo');b.disabled=true;
    AuthGate.run('invReceive',rows,$('rnote').value).then(function(res){return load().then(function(){renderRcv();msg('rmsg','تم استلام '+res.count+' صنف · '+res.units+' وحدة',true);});})
      .catch(function(e){b.disabled=false;msg('rmsg',errText(e),false);});
  }

  /* ---------- Count ---------- */
  var CIT=null;
  function renderCnt(){
    $('app').innerHTML='<div class="card"><label class="l" for="cq">الصنف</label><div class="field"><input type="text" id="cq" placeholder="اسم الصنف" autocomplete="off" style="direction:ltr;text-align:left"><div class="sugg" id="cs" hidden></div></div></div>'+
      '<div id="cbody"></div>';
    auto($('cq'),$('cs'),function(d){CIT=d;$('cq').value=d.name;cbody();});
    if(CIT){$('cq').value=CIT.name;cbody();}
  }
  function cbody(){
    var bs=D.batches.filter(function(b){return b.no===CIT.no;}).sort(function(a,b){return a.exp<b.exp?-1:1;});
    $('cbody').innerHTML='<div class="card"><div class="nm ltr" style="margin-bottom:8px">'+esc(nm(CIT))+'</div>'+
      '<div class="st" style="margin-bottom:6px">العدد الفعلي على الرف لكل تشغيلة (يُعدّ دون رؤية رصيد النظام).</div>'+
      bs.map(function(b){return '<div class="cl" data-id="'+esc(b.id)+'"><div><span class="ltr">'+esc(b.lot)+'</span> · '+fmtExp(b.exp)+'</div>'+
        '<input type="number" min="0" step="1" inputmode="numeric" placeholder="العدد" aria-label="العدد الفعلي '+esc(b.lot)+'"></div>';}).join('')+
      '<div id="cnew"></div><button class="add" id="cadd" type="button" style="margin-top:10px">+ تشغيلة غير مسجلة</button>'+
      '<label class="l" for="cnote">ملاحظة</label><input type="text" id="cnote" maxlength="120"></div>'+
      '<button class="btn" id="cgo" type="button">حفظ الجرد</button><div class="msg" id="cmsg" role="status"></div><div id="cres"></div>';
    $('cadd').onclick=function(){var d=document.createElement('div');d.className='cl new';
      d.innerHTML='<input type="text" class="lot" placeholder="التشغيلة" maxlength="30" style="direction:ltr" aria-label="رقم التشغيلة"><input type="month" class="exp" aria-label="الانتهاء"><input type="number" class="q" min="0" step="1" placeholder="العدد" inputmode="numeric" aria-label="العدد">';
      $('cnew').appendChild(d);d.querySelector('.lot').focus();};
    $('cgo').onclick=function(){
      var lines=[],bad=false;
      document.querySelectorAll('#cbody .cl[data-id]').forEach(function(r){var v=r.querySelector('input').value;if(v===''||!(+v>=0)){bad=true;return;}lines.push({batchId:r.dataset.id,counted:+v});});
      document.querySelectorAll('#cnew .cl').forEach(function(r){var lot=r.querySelector('.lot').value.trim(),exp=r.querySelector('.exp').value,v=r.querySelector('.q').value;
        if(!lot&&!exp&&v==='')return;if(!lot||!/^\d{4}-\d{2}$/.test(exp)||!(+v>=0)){bad=true;return;}lines.push({lot:lot,exp:exp,counted:+v});});
      if(bad)return msg('cmsg','يلزم إدخال عدد كل تشغيلة (0 إن لم توجد)',false);
      if(!lines.length)return msg('cmsg','لا توجد تشغيلات — تلزم إضافة تشغيلة',false);
      var b=$('cgo');b.disabled=true;
      AuthGate.run('invCount',CIT.no,lines,$('cnote').value).then(function(res){return load().then(function(){
        var it=CIT;cbody();msg('cmsg',res.diff===0?'تم الجرد — مطابق للنظام':'تم الجرد — الفرق الكلي '+(res.diff>0?'+':'')+res.diff,res.diff===0);
        $('cres').innerHTML='<div class="card"><table class="res" style="width:100%"><tr><td class="st">التشغيلة</td><td class="st">النظام</td><td class="st">الفعلي</td><td class="st">الفرق</td></tr>'+
          res.lines.map(function(l){return '<tr><td class="ltr">'+esc(l.lot)+'</td><td>'+l.system+'</td><td>'+l.counted+'</td><td style="font-weight:800;color:'+(l.diff?'var(--red)':'var(--green)')+'">'+(l.diff>0?'+':'')+l.diff+'</td></tr>';}).join('')+'</table></div>';
      });}).catch(function(e){b.disabled=false;msg('cmsg',errText(e),false);});
    };
  }

  /* ---------- Expiry ---------- */
  function renderExp(){
    var bs=D.batches.map(function(b){return{b:b,m:monthsLeft(b.exp),it:byNo(b.no)};}).filter(function(x){return x.it&&x.m<=3;})
      .sort(function(a,b){return a.m-b.m;});
    $('app').innerHTML='<div class="card"><div class="st" style="margin-bottom:6px">التشغيلات المنتهية أو التي تنتهي خلال ٣ أشهر (٩٠ يوماً تقريباً)، الأقرب أولاً.</div>'+
      (bs.length?bs.map(function(x){var exp=x.m<0;
        return '<div class="item"><div class="top" style="cursor:default"><div><div class="nm ltr">'+esc(nm(x.it))+'</div><div class="st">'+
          '<span class="ltr">'+esc(x.b.lot)+'</span> · '+fmtExp(x.b.exp)+'<span class="tag '+(exp?'t-red':'t-amb')+'">'+(exp?'منتهي':'ينتهي قريباً')+'</span></div></div>'+
          '<div class="qty">'+x.b.qty+'</div></div><button class="btn2" type="button" data-rm="'+esc(x.b.id)+'" style="margin-top:8px">إخراج من المخزون</button>'+
          '<div class="rm" hidden data-f="'+esc(x.b.id)+'"><input type="number" min="1" max="'+x.b.qty+'" value="'+x.b.qty+'" aria-label="الكمية">'+
          '<select aria-label="السبب"><option value="منتهي">منتهي</option><option value="تالف">تالف</option><option value="مرتجع للمستودع">مرتجع للمستودع</option></select>'+
          '<button class="btn2" type="button" data-ok="'+esc(x.b.id)+'" style="background:var(--red);color:#fff;border-color:var(--red)">تأكيد</button></div></div>';}).join('')
      :'<div class="empty">لا توجد تشغيلات منتهية أو قريبة الانتهاء</div>')+'</div><div class="msg" id="emsg" role="status"></div>';
    document.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){var f=document.querySelector('[data-f="'+b.dataset.rm+'"]');f.hidden=!f.hidden;};});
    document.querySelectorAll('[data-ok]').forEach(function(b){b.onclick=function(){
      var f=document.querySelector('[data-f="'+b.dataset.ok+'"]');b.disabled=true;
      AuthGate.run('invRemove',b.dataset.ok,f.querySelector('input').value,f.querySelector('select').value).then(function(){return load().then(function(){renderExp();msg('emsg','تم الإخراج وتسجيله',true);});})
        .catch(function(e){b.disabled=false;msg('emsg',errText(e),false);});};});
  }

  function render(){({bal:renderBal,rcv:renderRcv,cnt:renderCnt,exp:renderExp})[TAB]();}
  document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){TAB=b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b);});render();};});
  function load(){return AuthGate.run('invGetData').then(function(d){D=d;});}
  if(RO){document.querySelector('.tabs').style.display='none';document.querySelector('.banner').innerHTML='<b>رصيد المخزون</b><span>للاطلاع فقط — الرصيد والتشغيلات وحدود إعادة الطلب</span>';}
  AuthGate.start({accent:'#0a0a0a',bg:'#f4f4f5',barWidth:'640px',page:RO?'invread':'inventory',onReady:function(){
    load().then(render).catch(function(){$('app').innerHTML='<div class="msg err" style="display:block">تعذّر تحميل البيانات</div>';});
  }});
})();
</script>
</body>
</html>
