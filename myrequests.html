    }; });
  }
  /* page heading follows the open tab (e.g. Re-packaging → Stock shows «الرصيد · Stock») */

  }

      '<div style="text-align:center;background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:28px 32px;color:#0a0a0a">' +
      '<div style="font-weight:700;font-size:16px;margin-bottom:6px">Signed out · تم تسجيل الخروج</div>' +
      '<div style="color:#71717a;font-size:13px;margin-bottom:16px">Pharmacy Tracker by WaadAlwagdani</div>' +
      '<a href="' + u + '" target="_top" style="display:inline-block;background:#0a0a0a;color:#fff;text-decoration:none;border-radius:8px;padding:9px 18px;font-weight:600;font-size:13px">Sign in again · تسجيل الدخول مجددًا</a></div></div>';

  function start(o) {

    $('ag-lang').onclick = function () { LANG = LANG === 'en' ? 'ar' : 'en'; try { localStorage.setItem('ipq_lang', LANG); } catch (e) {} location.reload(); };
    var stored = null; try { stored = localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch (e) {}

    var boot = window.__IPQ_BOOT; window.__IPQ_BOOT = null;
    if (!boot && window.PT_SITE) { try { var pb = JSON.parse(sessionStorage.getItem('pt_boot') || 'null'); sessionStorage.removeItem('pt_boot');

  /** Opens another page the account may see (server checks the role), with a "home" chip for supervisors. */

<div class="wrap" style="max-width:760px">

<script>
/* Floor stock & Crash cart request — Pharmacy Tracker by WaadAlwagdani. No sign-in, no approval step. */
(function(){
  var ME=(AuthGate.user&&(AuthGate.user.displayName||AuthGate.user.username))||'', SEEN={}, MINE=null;
  var CFG=null, SEL=null, TYPE=null, ROWS=[], SUB=null, BUSY=false, rid=0;
  var ERR={NAME_REQUIRED:['Enter medication','اسم الدواء مطلوب'],QTY_INVALID:['Whole number ≥ 1','رقم صحيح ١ أو أكثر'],UNKNOWN_DRUG:['Pick from the list','يُختار من القائمة'],
    DEPT_REQUIRED:['Select department','القسم مطلوب'],TYPE_REQUIRED:['Select request type','نوع الطلب مطلوب'],BY_REQUIRED:['Name required','الاسم مطلوب'],
    NET:['Not sent — check connection','لم يُرسل — يُرجى التحقق من الاتصال'],TOO_MANY_ITEMS:['Too many items','عدد الأصناف كبير'],ITEMS_REQUIRED:['Add at least one item','يلزم إضافة صنف واحد على الأقل'],
    NO_LIST:['No saved list for this department yet','لا توجد قائمة محفوظة لهذا القسم بعد']};
  function bi(k){var v=ERR[k]||ERR.NET;return '<span class="bi"><span class="en">'+v[0]+'</span><span class="ar">'+v[1]+'</span></span>';}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function $(id){return document.getElementById(id);}
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(x){return null;}}
  function newSub(){SUB=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));}
  function dirty(){SUB=null;}

  function myWard(){var w=(AuthGate.user&&AuthGate.user.ward)||'';if(!w)return null;var k=w.split('|');return {h:k[0],d:k.slice(1).join('|')};}
  function render(){
    var h='<div class="card"><div class="lbl bi" id="typeLbl"><span class="en">Request type</span><span class="ar">نوع الطلب</span></div><div class="err" id="typeErr"></div><div class="pills">'+
      CFG.types.map(function(t){return '<button type="button" class="pill tp" role="radio" aria-checked="false" data-t="'+t.key+'">'+esc(t.en)+' · '+(t.key==='crash'?'عربة الطوارئ':'مخزون القسم')+'</button>';}).join('')+'</div></div>';
    var MW=myWard();
    if(MW) h+='<div class="card"><div class="lbl bi" id="deptLbl"><span class="en">Department</span><span class="ar">القسم</span></div><div style="font-size:18px;font-weight:700;direction:ltr;text-align:left">'+esc(MW.d)+'</div><div class="err" id="deptErr"></div></div>';
    else h+='<div class="card"><div class="lbl bi" id="deptLbl"><span class="en">Department</span><span class="ar">القسم الطالب</span></div><div class="err" id="deptErr"></div>';
    if(!MW){
    if(!CFG.hospitals.length)h+='<div class="err" style="display:block">Departments are not set up yet · لم تُعدّ الأقسام بعد</div>';
    CFG.hospitals.forEach(function(H){
      h+='<div class="grp">'+esc(H.name)+'</div><div class="pills">'+
        H.depts.map(function(d){return '<button type="button" class="pill dp" role="radio" aria-checked="false" data-h="'+H.key+'" data-d="'+esc(d)+'">'+esc(d)+'</button>';}).join('')+'</div>';
    });
    h+='</div>';}
    h+='<input type="hidden" id="by" value="'+esc(ME)+'">';
    h+='<div class="card"><div class="lbl bi"><span class="en">Items</span><span class="ar">الأصناف المطلوبة</span></div>'+
      '<div class="tools"><button type="button" id="load">Load default list<br><span class="ar">تحميل القائمة الافتراضية</span></button>'+
      '<button type="button" id="save">Save as default<br><span class="ar">حفظ كقائمة افتراضية</span></button></div>'+
      '<div class="hint" dir="rtl">القائمة الافتراضية محفوظة لكل قسم ونوع طلب، وتُحمَّل بضغطة واحدة بدل إدخال الأصناف كل مرة.</div><div id="rows" style="margin-top:10px"></div>'+
      '<button type="button" class="add" id="add"><span class="btnbi"><span class="en">+ Add Item</span><span class="ar">إضافة صنف</span></span></button>'+
      '<div class="fld" style="margin-top:10px"><div class="cap"><span>Needed by (optional — schedule ahead)</span><span class="ar">موعد الاحتياج (اختياري — للجدولة مسبقًا)</span></div><input type="datetime-local" id="need"></div>'+
      '<div class="fld" style="margin-top:10px"><div class="cap"><span>Note (optional)</span><span class="ar">ملاحظة (اختياري)</span></div><input type="text" id="note" maxlength="200" autocomplete="off"></div></div>'+
      '<button type="button" class="go" id="go"><span class="btnbi"><span class="en">Send request</span><span class="ar">إرسال الطلب</span></span></button>';
    $('app').innerHTML=h;
    document.querySelectorAll('.tp').forEach(function(p){p.onclick=function(){TYPE=p.dataset.t;dirty();document.querySelectorAll('.tp').forEach(function(x){x.setAttribute('aria-checked',x===p?'true':'false');});$('typeErr').innerHTML='';};});
    document.querySelectorAll('.dp').forEach(function(p){p.onclick=function(){SEL={h:p.dataset.h,d:p.dataset.d};dirty();document.querySelectorAll('.dp').forEach(function(x){x.setAttribute('aria-checked',x===p?'true':'false');});$('deptErr').innerHTML='';};});
    $('add').onclick=function(){addRow(true);};
    $('go').onclick=send; $('load').onclick=loadList; $('save').onclick=saveList;
    ROWS=[];$('rows').innerHTML='';addRow(false);
    if(MW)SEL={h:MW.h,d:MW.d};
  }
  function addRow(focus,pre){
    var r={id:++rid,drugNo:pre?pre.drugNo:''};ROWS.push(r);
    var el=document.createElement('div');el.className='row';
    el.innerHTML='<div class="head"><span>#'+ROWS.length+'</span><button type="button" class="rm"><span class="en">Remove</span> | <span class="ar">حذف</span></button></div>'+
      '<div class="fld"><div class="cap"><span>Medication</span><span class="ar">اسم الصنف</span></div>'+
        '<input type="text" class="nm" autocomplete="off" spellcheck="false" maxlength="80"><div class="sugg" hidden></div><div class="err"></div></div>'+
      '<div class="fld"><div class="cap"><span>Qty</span><span class="ar">الكمية</span></div>'+
        '<input type="text" class="qt" inputmode="numeric" maxlength="5" autocomplete="off"><div class="err"></div></div>';
    $('rows').appendChild(el);r.el=el;
    var nm=el.querySelector('.nm'),qt=el.querySelector('.qt'),box=el.querySelector('.sugg');
    if(pre){nm.value=pre.name+(pre.strength?' '+pre.strength:'');qt.value=pre.qty;}
    auto(nm,box,function(d){r.drugNo=d.no;nm.value=d.name+(d.strength?' '+d.strength:'');clearErr(nm);dirty();qt.focus();});
    nm.addEventListener('input',function(){r.drugNo='';clearErr(nm);dirty();});
    qt.addEventListener('input',function(){qt.value=qt.value.replace(/[^0-9]/g,'');clearErr(qt);dirty();});
    el.querySelector('.rm').onclick=function(){ROWS=ROWS.filter(function(x){return x!==r;});el.remove();renumber();dirty();if(!ROWS.length)addRow(false);};
    if(focus)nm.focus();
  }
  function renumber(){ROWS.forEach(function(r,i){r.el.querySelector('.head span').textContent='#'+(i+1);});}
  function clearErr(inp){inp.classList.remove('bad');inp.parentNode.querySelector('.err').innerHTML='';}
  function setErr(inp,k){inp.classList.add('bad');inp.parentNode.querySelector('.err').innerHTML=bi(k);}
  function auto(inp,box,onPick){
    var list=[],idx=-1;
    function show(){var q=inp.value.trim().toLowerCase();idx=-1;
      list=q.length<2?[]:CFG.drugs.filter(function(d){return d.name.toLowerCase().indexOf(q)===0;})
        .concat(CFG.drugs.filter(function(d){return d.name.toLowerCase().indexOf(q)>0;})).slice(0,8);
      if(!list.length){box.hidden=true;return;}
      box.innerHTML=list.map(function(d,i){return '<div data-i="'+i+'">'+esc(d.name)+' <small>'+esc(d.strength||'')+'</small></div>';}).join('');box.hidden=false;
      box.querySelectorAll('div').forEach(function(el){el.onmousedown=function(e){e.preventDefault();onPick(list[+el.dataset.i]);box.hidden=true;};});}
    inp.addEventListener('input',show);inp.addEventListener('blur',function(){setTimeout(function(){box.hidden=true;},150);});
    inp.addEventListener('keydown',function(e){if(box.hidden)return;
      if(e.key==='ArrowDown')idx=Math.min(idx+1,list.length-1);else if(e.key==='ArrowUp')idx=Math.max(idx-1,0);
      else if(e.key==='Enter'){e.preventDefault();onPick(list[Math.max(idx,0)]);box.hidden=true;return;}else return;
      box.querySelectorAll('div').forEach(function(el,i){el.classList.toggle('on',i===idx);});});
  }
  function msg(html,ok,retry){var m=$('msg');m.className='msg '+(ok?'ok':'bad');m.innerHTML=html+(retry?'<button type="button" class="retry"><span class="btnbi"><span class="en">Retry</span><span class="ar">إعادة المحاولة</span></span></button>':'');m.hidden=false;
    if(retry)m.querySelector('.retry').onclick=send;window.scrollTo(0,0);}
  function needPlace(){var bad=false;if(!TYPE){$('typeErr').innerHTML=bi('TYPE_REQUIRED');bad=true;}if(!SEL){$('deptErr').innerHTML=bi('DEPT_REQUIRED');bad=true;}
    if(bad)$('typeLbl').scrollIntoView({block:'center',behavior:'smooth'});return bad;}
  function collect(){
    var bad=false,items=[];
    ROWS.forEach(function(r){var nm=r.el.querySelector('.nm'),qt=r.el.querySelector('.qt'),n=nm.value.trim(),q=qt.value.trim();
      if(!n&&!q&&ROWS.length>1)return;
      if(!r.drugNo){setErr(nm,n?'UNKNOWN_DRUG':'NAME_REQUIRED');bad=true;}
      if(!/^\d+$/.test(q)||+q<1||+q>10000){setErr(qt,'QTY_INVALID');bad=true;}
      items.push({drugNo:r.drugNo,qty:+q});});

    return items;
  }
  function serverErr(e){
    var m=String(e&&e.message||''),v=m.match(/VALIDATION:(\[.*\])/);
    if(v){try{JSON.parse(v[1]).forEach(function(x){var r=ROWS[x.i];if(r)setErr(r.el.querySelector(x.f==='qty'?'.qt':'.nm'),x.e);});}catch(z){}return;}
    var k=(m.match(/DEPT_REQUIRED|TOO_MANY_ITEMS|ITEMS_REQUIRED|NAME_REQUIRED/)||['NET'])[0];if(k==='NAME_REQUIRED')k='BY_REQUIRED';
    msg(bi(k),false,k==='NET');
  }
  function loadList(){
    if(needPlace())return;
    $('load').disabled=true;
    google.script.run.withSuccessHandler(function(list){$('load').disabled=false;
      if(!list.length){msg(bi('NO_LIST'),false,false);return;}
      $('msg').hidden=true;ROWS=[];$('rows').innerHTML='';list.forEach(function(it){addRow(false,it);});dirty();
    }).withFailureHandler(function(e){$('load').disabled=false;serverErr(e);}).wardGetList(SEL.h,SEL.d,TYPE);
  }
  function saveList(){
    if(needPlace())return;var items=collect();if(!items)return;
    $('save').disabled=true;
    google.script.run.withSuccessHandler(function(r){$('save').disabled=false;
      msg('<span class="bi"><span class="en">Default list saved ✓ ('+r.count+')</span><span class="ar">تم حفظ القائمة الافتراضية ✓ ('+r.count+')</span></span>',true,false);
    }).withFailureHandler(function(e){$('save').disabled=false;serverErr(e);}).wardSaveList({hospital:SEL.h,dept:SEL.d,type:TYPE,items:items,by:$('by').value.trim()});
  }
  function send(){
    if(BUSY)return;$('msg').hidden=true;

    var items=collect();if(bad||!items)return;
    if(!SUB)newSub();store('ward_by',by);
    BUSY=true;$('go').disabled=true;
    AuthGate.run('wardSubmitMe',{submissionId:SUB,type:TYPE,hospital:SEL.h,dept:SEL.d,items:items,note:$('note').value.trim(),needBy:$('need').value}).then(function(r){
      BUSY=false;SUB=null;TYPE=null;SEL=null;render();loadMine();
      msg('<span class="bi"><span class="en">Request sent ✓</span><span class="ar">تم إرسال الطلب ✓</span></span><small style="direction:ltr;text-align:left">'+esc(r.type)+' · '+esc(r.dept)+' · '+r.count+' item'+(r.count>1?'s':'')+' · '+esc(r.id)+(r.needBy?' · Needed by '+esc(r.needBy):'')+'</small>',true,false);
    },function(e){BUSY=false;$('go').disabled=false;serverErr(e);});
  }
  /* My requests + "ready" alert (checked every minute) */
  var AR={New:'جديد',Preparing:'قيد التجهيز',Ready:'جاهز للاستلام',Delivered:'تم التسليم',Cancelled:'ملغى'};
  var SC={New:'#b91c1c;background:#fde8e8',Preparing:'#a16207;background:#fef6dc',Ready:'#1e40af;background:#e8eefc',Delivered:'#15803d;background:#e6f4ea',Cancelled:'#6b6862;background:#eeeeec'};
  try{SEEN=JSON.parse(localStorage.getItem('ward_seen_ready')||'{}');}catch(x){SEEN={};}
  function loadMine(){AuthGate.run('wardMine').then(function(d){MINE=d.rows;drawMine();},function(){});}
  function drawMine(){
    var ready=MINE.filter(function(r){return r.status==='Ready';});
    var fresh=ready.filter(function(r){return !SEEN[r.id];});
    $('ready').hidden=!ready.length;
    $('ready').innerHTML=ready.length?'<div class="msg ok" style="border:2px solid #1e40af;background:#e8eefc;color:#1e40af"><span class="bi"><span class="en">'+ready.length+' request(s) ready for pickup</span><span class="ar">'+ready.length+' طلب جاهز للاستلام</span></span><small>'+ready.map(function(r){return esc(r.type)+' · '+esc(r.dept)+' · '+esc(r.id);}).join('<br>')+'</small></div>':'';
    if(fresh.length){document.title='● '+document.title.replace(/^● /,'');try{if(window.Notification&&Notification.permission==='granted')new Notification('Pharmacy Tracker',{body:'طلبك جاهز للاستلام · Your request is ready'});}catch(x){}
      fresh.forEach(function(r){SEEN[r.id]=1;});try{localStorage.setItem('ward_seen_ready',JSON.stringify(SEEN));}catch(x){}}
    $('mine').innerHTML=MINE.length?MINE.map(function(r){
      return '<div class="card"><div class="bi" style="align-items:center"><span class="en"><b>'+esc(r.type)+'</b> · '+esc(r.dept)+'<br><small style="color:var(--muted)">'+esc(r.id)+' · '+esc(r.at)+(r.needBy?' · Needed by '+esc(r.needBy):'')+'</small></span>'+
        '<span style="border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;color:'+(SC[r.status]||SC.New)+'">'+esc(AR[r.status]||r.status)+' · '+esc(r.status)+'</span></div>'+
        '<ul style="margin:8px 0 0;padding:0 18px;direction:ltr;text-align:left">'+r.items.map(function(it){return '<li>'+esc(it.name)+(it.strength?' '+esc(it.strength):'')+' — <b>'+it.qty+'</b></li>';}).join('')+'</ul>'+
        (r.handler?'<small style="display:block;color:var(--muted);margin-top:6px">'+esc(r.handler)+' · '+esc(r.updated)+'</small>':'')+'</div>';
    }).join(''):'<div class="card" style="color:var(--muted)"><span class="bi"><span class="en">No requests yet</span><span class="ar">لا توجد طلبات بعد</span></span></div>';
  }
  function tab(t){document.querySelectorAll('.ptabs .pill').forEach(function(b){var on=b.dataset.t===t;b.classList.toggle('on',on);b.setAttribute('aria-checked',on);});
    $('app').hidden=t!=='new';$('mine').hidden=t!=='mine';}
  document.querySelectorAll('.ptabs .pill').forEach(function(b){b.onclick=function(){tab(b.dataset.t);};});
  AuthGate.start({accent:'#0a0a0a',bg:'#f6f5f2',barWidth:'760px',page:'wardreq',onReady:function(){
    ME=(AuthGate.user&&(AuthGate.user.displayName||AuthGate.user.username))||'';
    google.script.run.withSuccessHandler(function(c){CFG=c;render();})
      .withFailureHandler(function(){$('app').innerHTML='<div class="msg bad">'+bi('NET')+'</div>';}).wardConfig();
    loadMine();setInterval(function(){if(!document.hidden)loadMine();},60000);
    try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission();}catch(x){}
  }});
})();
</script>
</body>
</html>
