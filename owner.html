        '<h3 style="margin-top:14px">' + B('Working days', 'أيام العمل') + '</h3><div class="chips">' + DN.map(function (n, i) { return '<label class="chk"><input type="checkbox" class="t-day" value="' + i + '"' + (D.workdays.indexOf(i) > -1 ? ' checked' : '') + '>' + n[1] + ' · ' + n[0] + '</label>'; }).join('') + '</div>' +
        '<h3 style="margin-top:14px">' + B('ADC departments (one per line)', 'أقسام أجهزة ADC (قسم في كل سطر)') + '</h3><textarea class="t-adc ltr" rows="8" style="width:100%;border:1px solid #c3cad3;border-radius:8px;padding:8px;font-family:inherit">' + esc(D.adc.join('\n')) + '</textarea>' +
        '<div class="row" style="margin-top:10px"><button type="button" class="pri t-save">' + B('Save tasks', 'حفظ المهام') + '</button></div><div class="msg t-msg"></div>';
      function sync() { p.querySelectorAll('.tkb tr').forEach(function (tr) { var t = T[+tr.dataset.i]; tr.querySelectorAll('[data-f]').forEach(function (i) { t[i.dataset.f] = i.type === 'checkbox' ? i.checked : i.value; }); }); }
      function bind() { p.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { sync(); T.splice(+b.dataset.del, 1); p.querySelector('.tkb').innerHTML = rowsHtml(); bind(); }; }); }
      bind();
      p.querySelector('.t-def').onclick = function () { T = (D.defaultTasks || []).map(function (t) { return Object.assign({}, t); }); p.querySelector('.tkb').innerHTML = rowsHtml(); bind(); };
      p.querySelector('.t-add').onclick = function () { sync(); T.push({ id: '', ar: '', en: '', slots: 1, adc: false }); p.querySelector('.tkb').innerHTML = rowsHtml(); bind(); };
      p.querySelector('.t-save').onclick = function () {
        sync(); var b = this; b.disabled = true;
        var days = [].slice.call(p.querySelectorAll('.t-day:checked')).map(function (x) { return +x.value; });
        AuthGate.run('dutySaveConfig', { tasks: T, adc: p.querySelector('.t-adc').value.split('\n'), days: days }).then(function () { b.disabled = false; p.hidden = true; load().then(function () { msg(M, B('Tasks saved', 'تم حفظ المهام'), true); }); })
          .catch(function (e) { b.disabled = false; msg(p.querySelector('.t-msg'), err(e), false); });
      };
    }
  }

  /* ---------------- Supervision ---------------- */
  function supervision(el) {
    el.innerHTML = '<div class="ou"><div class="s-body"><div class="empty">…</div></div></div>';
    var flash = null;   // confirmation shown again after the panel reloads
    load();
    function load() {
      AuthGate.run('orgOverview').then(function (d) {
        var body = el.querySelector('.s-body');
        var catOpt = function (v) { return '<option value=""></option>' + d.categories.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === v ? ' selected' : '') + '>' + esc((c.en ? c.en + ' · ' : '') + c.label) + '</option>'; }).join(''); };
        var respName = function (c) { var x = d.resps.filter(function (y) { return y.code === c; })[0]; return x ? esc(x.en + ' · ' + x.ar) : esc(c); };
        /* responsibilities per employee — editable by the supervisor (descriptive only, no permissions) */
        var team = d.canManage ? d.employees : d.mine.emps;
        var respPanel = '<div class="panel"><h3>' + B(d.canManage ? 'Employees · responsibilities' : 'My team', d.canManage ? 'الموظفون · المسؤوليات' : 'فريقي') + '</h3>' +
          '<div style="color:#5b6472;font-size:12.5px;margin:-4px 0 10px">' + B('Click Edit to set what each employee does', 'يُضغط «تعديل» لتحديد مسؤوليات كل موظف') + '</div>' +
          (team.length ? '<table><tbody>' + team.map(function (e) {
            return '<tr data-e="' + esc(e.id) + '"><td style="white-space:nowrap"><b>' + esc(e.name) + '</b></td><td class="r-view">' + (e.resps.length ? e.resps.map(respName).join('<br>') : '<span style="color:#a1a1aa">—</span>') + '</td>' +
              '<td style="white-space:nowrap"><span class="tag ' + (e.active ? 't-ok' : 't-warn') + '">' + (e.active ? 'active' : 'inactive') + '</span></td>' +
              '<td style="white-space:nowrap"><button type="button" class="r-ed">' + B('Edit', 'تعديل') + '</button></td></tr>' +
              '<tr class="r-form" data-f="' + esc(e.id) + '" hidden><td colspan="4"><div class="chips">' + d.resps.map(function (r) {
                return '<label class="chk"><input type="checkbox" value="' + r.code + '"' + (e.resps.indexOf(r.code) > -1 ? ' checked' : '') + '>' + esc(r.en) + ' · ' + esc(r.ar) + '</label>'; }).join('') + '</div>' +
              '<div class="row" style="margin-top:8px"><button type="button" class="pri r-save">' + B('Save', 'حفظ') + '</button><button type="button" class="r-cancel">' + B('Cancel', 'إلغاء') + '</button></div><div class="msg r-msg"></div></td></tr>'; }).join('') + '</tbody></table>'
            : '<div class="empty">' + B('No employees assigned yet', 'لا موظفين مسندين بعد') + '</div>') + '</div>';
        function bindResp() {
          body.querySelectorAll('tr[data-e]').forEach(function (tr) {
            var f = body.querySelector('tr[data-f="' + tr.dataset.e + '"]');
            tr.querySelector('.r-ed').onclick = function () { f.hidden = !f.hidden; };
            f.querySelector('.r-cancel').onclick = function () { f.hidden = true; };
            f.querySelector('.r-save').onclick = function () {
              var b = this, codes = [].slice.call(f.querySelectorAll('input:checked')).map(function (x) { return x.value; }); b.disabled = true;
              AuthGate.run('orgSetResps', tr.dataset.e, codes).then(function (r) {
                b.disabled = false; team.filter(function (x) { return x.id === tr.dataset.e; })[0].resps = r.resps;
                tr.querySelector('.r-view').innerHTML = r.resps.length ? r.resps.map(respName).join('<br>') : '<span style="color:#a1a1aa">—</span>';
                f.hidden = true; msg(f.querySelector('.r-msg'), '', true);
              }, function (e) { b.disabled = false; msg(f.querySelector('.r-msg'), err(e), false); });
            };
          });
        }
        if (!d.canManage) { body.innerHTML = respPanel; bindResp(); return; }
        body.innerHTML = d.supervisors.length ? d.supervisors.map(function (s) {
          return '<div class="panel" data-s="' + esc(s.id) + '"><div class="row" style="justify-content:space-between"><h3 style="margin:0">' + esc(s.name) + ' <span class="ltr" style="color:#5b6472;font-weight:500">@' + esc(s.username) + '</span></h3>' +
            '<select class="s-cat" aria-label="category">' + catOpt(s.category) + '</select></div>' +
            '<label class="f" style="margin-top:10px">' + B('Employees', 'الموظفون') + '</label><div class="chips">' + d.employees.map(function (e) {
              return '<label class="chk"><input type="checkbox" value="' + esc(e.id) + '"' + (s.emps.indexOf(e.id) > -1 ? ' checked' : '') + ' class="s-emp">' + esc(e.name) + '</label>'; }).join('') + '</div>' +
            '<label class="f" style="margin-top:10px">' + B('Responsibilities overseen (none = all)', 'المسؤوليات تحت الإشراف (بلا تحديد = الكل)') + '</label><div class="chips">' + d.resps.map(function (r) {
              return '<label class="chk"><input type="checkbox" value="' + r.code + '"' + (s.scopeResps.indexOf(r.code) > -1 ? ' checked' : '') + ' class="s-resp">' + esc(r.en) + ' · ' + esc(r.ar) + '</label>'; }).join('') + '</div>' +
            '<div class="row" style="margin-top:10px"><button type="button" class="pri s-save">' + B('Save', 'حفظ') + '</button></div><div class="msg s-msg"></div></div>';
        }).join('') : '<div class="panel empty">' + B('No department supervisor accounts yet — the Owner creates them', 'لا حسابات لمشرفي الأقسام بعد — ينشئها المالك') + '</div>';
        body.insertAdjacentHTML('beforeend', respPanel); bindResp();
        if (flash) { var fp = body.querySelector('[data-s="' + flash + '"] .s-msg'); if (fp) msg(fp, B('Saved', 'تم الحفظ'), true); flash = null; }
        body.querySelectorAll('[data-s]').forEach(function (p) {
          p.querySelector('.s-save').onclick = function () {
            var b = this; b.disabled = true;
            var emps = [].slice.call(p.querySelectorAll('.s-emp:checked')).map(function (x) { return x.value; });
            var resps = [].slice.call(p.querySelectorAll('.s-resp:checked')).map(function (x) { return x.value; });
            AuthGate.run('orgSetSupervision', p.dataset.s, emps, resps, p.querySelector('.s-cat').value).then(function () { b.disabled = false; flash = p.dataset.s; load(); })
              .catch(function (e) { b.disabled = false; msg(p.querySelector('.s-msg'), err(e), false); });
          };
        });
      }).catch(function (e) { el.querySelector('.s-body').innerHTML = '<div class="panel msg err">' + err(e) + '</div>'; });
    }
  }

  /* ---------------- Tabs helper ---------------- */
  function tabs(host, list) {
    host.innerHTML = '<div class="ou"><div class="ou-tabs" role="tablist" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' + list.map(function (t, i) {
      return '<button type="button" role="tab" data-t="' + i + '" style="height:40px;padding:0 14px;border:1px solid #dde1e7;border-radius:999px;background:' + (i ? '#fff' : '#0a0a0a') + ';color:' + (i ? '#171b1f' : '#fff') + ';font-family:inherit;font-weight:600;font-size:13px;cursor:pointer">' + t.en + ' · ' + t.ar + '</button>';
    }).join('') + '</div><div class="ou-pane"></div></div>';
    var pane = host.querySelector('.ou-pane'), btns = host.querySelectorAll('[data-t]');
    function show(i) { btns.forEach(function (b, j) { b.style.background = j === i ? '#0a0a0a' : '#fff'; b.style.color = j === i ? '#fff' : '#171b1f'; b.setAttribute('aria-selected', j === i); }); pane.innerHTML = ''; list[i].render(pane); }
    btns.forEach(function (b) { b.onclick = function () { show(+b.dataset.t); }; });
    show(0);
  }

  return { B: B, esc: esc, err: err, msg: msg, monitor: monitor, duty: duty, roster: duty, supervision: supervision, tabs: tabs, iso: iso, loadLib: loadLib };
})();
</script>

<div class="wrap">
  <div class="banner"><span class="bi"><span class="en">Owner dashboard</span><span class="ar">لوحة المالك</span></span></div>
  <div id="main"></div>
  <footer>Pharmacy Tracker by WaadAlwagdani</footer>
</div>
<script>
(function(){
  var B=OrgUI.B,esc=OrgUI.esc;
  var ROLES=[['PHARMACIST','Pharmacist','صيدلي'],['NURSE','Nurse','تمريض'],['QUALITY','Quality (view all, read-only)','الجودة (اطلاع على كل شيء)'],['DEPT_SUPERVISOR','Department supervisor','مشرف قسم'],['PHARMACY_SUPERVISOR','Pharmacy supervisor','مشرف الصيدلية']];
  var STATIONS=[['pack','Re-packaging','إعادة التغليف'],['inventory','Inventory','المخزون'],['adc','ADC withdraw (nursing)','سحب الكابينات (تمريض)'],['adcrefill','ADC refill','تعبئة الكابينات'],['adccount','ADC count & zeroing','جرد وتصفير الكابينات'],['floor','Floor stock','مخزون الأقسام'],['crash','Crash cart','عربة الطوارئ'],['qmer','Quality: medication error reports','الجودة: بلاغات الأخطاء الدوائية'],['qgov','Quality: governance audit','الجودة: التدقيق الشهري للحوكمة'],['qinsp','Quality: inspections','الجودة: جولات التفتيش']];
  var EXTRA=[['labels','Labels tool','أداة الليبلات'],['dash','Dashboard','المؤشرات'],['invread','Inventory balance (view)','رصيد المخزون (اطلاع)']];
  var HOMES=[['','Automatic','تلقائي'],['supervisor','Supervision','الإشراف'],['pack','Re-packaging','إعادة التغليف'],['inventory','Inventory','المخزون'],['invread','Inventory balance','رصيد المخزون'],['dash','Dashboard','المؤشرات'],['labels','Labels','الليبلات'],['adc','ADC cabinets','الكابينات'],['ward','Ward requests','طلبات الأقسام'],['wardreq','My requests (nursing)','طلباتي (تمريض)'],['quality','Quality','الجودة'],['schedule','My tasks','مهامي']];
  var RESP=null,CATS=null,USERS=[];
  function pageLabel(p){var x=STATIONS.concat(EXTRA,HOMES).filter(function(y){return y[0]===p})[0];return x?x[1]:p;}
  function roleName(r){var x=ROLES.filter(function(y){return y[0]===r})[0];return r==='OWNER'?'Owner · المالك':x?x[1]+' · '+x[2]:r;}
  function stTag(u){var now=Date.now(),exp=u.validTo&&now>=Date.parse(u.validTo),pre=u.validFrom&&now<Date.parse(u.validFrom);
    if(u.status==='pending')return '<span class="tag t-warn">'+B('Awaiting approval','بانتظار الموافقة')+'</span>';
    if(u.status!=='active')return '<span class="tag '+(u.status==='terminated'?'t-bad':'t-warn')+'">'+u.status+'</span>';
    if(exp)return '<span class="tag t-bad">expired</span>';if(pre)return '<span class="tag t-warn">not started</span>';return '<span class="tag t-ok">active</span>';}

  function accounts(el){
    el.innerHTML='<div class="ou"><div class="panel drawer" id="dr" hidden></div><div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px">'+
      '<input id="q" placeholder="Search · بحث" style="flex:1;max-width:320px"><button type="button" class="pri" id="new">'+B('+ New account','حساب جديد')+'</button></div>'+
      '<div class="msg" id="am"></div><div style="overflow:auto"><table class="acc"><thead><tr><th>'+B('Account','الحساب')+'</th><th>'+B('System role','الدور')+'</th><th>'+B('Access','الصلاحيات')+'</th><th>'+B('Validity','الصلاحية الزمنية')+'</th><th>'+B('Status','الحالة')+'</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div></div>';
    el.querySelector('#new').onclick=function(){form(null)};el.querySelector('#q').oninput=draw;
    load();
    function load(){
      Promise.all([AuthGate.run('authAdminListUsers'),AuthGate.run('orgOverview')]).then(function(r){USERS=r[0];RESP=r[1].resps;CATS=r[1].categories;draw();})
        .catch(function(e){OrgUI.msg(el.querySelector('#am'),OrgUI.err(e),false);});
    }
    function draw(){
      var q=(el.querySelector('#q').value||'').toLowerCase();
      el.querySelector('#tb').innerHTML=USERS.filter(function(u){return !q||(u.displayName+' '+u.username).toLowerCase().indexOf(q)>-1}).map(function(u){
        var access=u.stations.concat(u.extraPages).map(function(p){return '<span class="tag t-n">'+esc(pageLabel(p))+'</span>'}).join(' ')+(u.resps.length?'<div style="font-size:11.5px;color:#71717a;margin-top:3px">'+u.resps.length+' responsibilities</div>':'');
        return '<tr data-id="'+esc(u.id)+'"><td><b>'+esc(u.displayName)+'</b><div class="ltr" style="font-size:12px;color:#71717a">@'+esc(u.username)+(u.empRef?' · #'+esc(u.empRef):'')+'</div></td>'+
          '<td>'+esc(roleName(u.sysRole))+'<div style="font-size:11.5px;color:#71717a">home: '+esc(pageLabel(u.home))+'</div></td><td>'+(u.isOwner?'<span class="lock">🔒 full</span>':access)+'</td>'+
          '<td class="ltr" style="font-size:12px">'+(u.isOwner?'∞':(u.validFrom?esc(u.validFrom.replace('T',' ')):'—')+' → '+(u.validTo?esc(u.validTo.replace('T',' ')):'—'))+'</td><td>'+stTag(u)+'</td>'+
          '<td>'+(u.isOwner?'<span class="lock">🔒 '+B('Protected','محمي')+'</span>':'<div class="acts">'+
            '<button class="sm" data-a="edit">'+B('Edit','تعديل')+'</button>'+(u.status!=='terminated'?'<button class="sm" data-a="preview">'+B('👁 Preview','👁 معاينة')+'</button>':'')+
            (u.status==='active'?'<button class="sm danger" data-a="suspended">'+B('Suspend','إيقاف')+'</button>':'<button class="sm'+(u.status==='pending'?' pri':'')+'" data-a="active">'+B(u.status==='pending'?'Approve':'Activate',u.status==='pending'?'موافقة وتفعيل':'تفعيل')+'</button>')+
            '<button class="sm" data-a="reset">'+B('Reset password','كلمة مرور مؤقتة')+'</button><button class="sm" data-a="revoke">'+B('End sessions','إنهاء الجلسات')+'</button>'+
            (u.status!=='terminated'?'<button class="sm danger" data-a="terminated">'+B('Terminate','إنهاء الحساب')+'</button>':'')+'</div>')+'</td></tr>';
      }).join('');
      el.querySelectorAll('#tb [data-a]').forEach(function(b){b.onclick=function(){
        var id=b.closest('tr').dataset.id,u=USERS.filter(function(x){return x.id===id})[0],a=b.dataset.a,m=el.querySelector('#am');
        if(a==='edit')return form(u);
        if(a==='preview'){b.disabled=true;return AuthGate.run('authPreviewStart',id).then(function(r){b.disabled=false;
          if(r.ok)return AuthGate.startPreview(r);
          var d=r.diag,why=[];if(d.status!=='active')why.push(B('Status: '+d.status,'الحالة: '+({suspended:'موقوف',terminated:'منتهٍ'}[d.status]||d.status)));
          if(!d.inValidity)why.push(B('Outside validity period','خارج فترة صلاحية الحساب')+' <span class="ltr">'+esc((d.validFrom||'—')+' → '+(d.validTo||'—'))+'</span>');
          OrgUI.msg(m,'<b>'+B('This account cannot sign in','هذا الحساب لا يستطيع تسجيل الدخول')+'</b>'+why.map(function(x){return '<div style="font-weight:400">'+x+'</div>'}).join(''),false);
        }).catch(function(e){b.disabled=false;OrgUI.msg(m,OrgUI.err(e),false);});}
        var p=a==='reset'?(function(){var pw=window.prompt('Temporary password (10+ characters) · كلمة مرور مؤقتة');return pw?AuthGate.run('authAdminResetPassword',id,pw):null})()
          :a==='revoke'?AuthGate.run('authAdminRevokeSessions',id):AuthGate.run('authAdminSetStatus',id,a);
        if(!p)return;b.disabled=true;p.then(function(){OrgUI.msg(m,B('Done','تم'),true);load();}).catch(function(e){b.disabled=false;OrgUI.msg(m,OrgUI.err(e),false);});
      };});
    }
    function checks(list,sel,cls){return '<div class="chips">'+list.map(function(x){return '<label class="chk"><input type="checkbox" class="'+cls+'" value="'+x[0]+'"'+(sel.indexOf(x[0])>-1?' checked':'')+'>'+x[1]+' · '+x[2]+'</label>'}).join('')+'</div>';}
    function form(u){
      var d=el.querySelector('#dr');d.hidden=false;var isNew=!u;u=u||{sysRole:'PHARMACIST',stations:[],extraPages:[],resps:[],home:'',category:'',validFrom:'',validTo:''};
      var dt=function(v){return v?(v.length===10?v+'T00:00':v.slice(0,16)):''};
      d.innerHTML='<h3>'+(isNew?B('New account','حساب جديد'):B('Edit account','تعديل الحساب')+' <span class="ltr">@'+esc(u.username)+'</span>')+'</h3><div class="grid2">'+
        (isNew?'<div><label class="f">'+B('Username','اسم المستخدم')+'</label><input id="f-u" class="ltr" maxlength="32" autocapitalize="none"></div>':'')+
        '<div><label class="f">'+B('Display name','الاسم الظاهر')+'</label><input id="f-d" maxlength="60" value="'+esc(u.displayName||'')+'"></div>'+
        '<div><label class="f">'+B('Employees tab ID','الرقم في تبويب Employees')+'</label><input id="f-ref" class="ltr" maxlength="30" value="'+esc(u.empRef||'')+'"></div>'+
        '<div id="f-ww"><label class="f">'+B('Department (nursing account)','القسم (لحساب التمريض)')+'</label><select id="f-w"><option value="">'+(u.ward?esc(u.ward.split('|').slice(1).join('|')):'—')+'</option></select></div>'+
        '<div><label class="f">'+B('System role','الدور')+'</label><select id="f-r">'+ROLES.map(function(r){return '<option value="'+r[0]+'"'+(r[0]===u.sysRole?' selected':'')+'>'+r[1]+' · '+r[2]+'</option>'}).join('')+'</select></div>'+
        '<div><label class="f">'+B('Supervisor category','فئة الإشراف')+'</label><select id="f-c"><option value=""></option>'+CATS.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===u.category?' selected':'')+'>'+esc((c.en?c.en+' · ':'')+c.label)+'</option>'}).join('')+'</select></div>'+
        '<div><label class="f">'+B('Landing page','الصفحة الافتراضية')+'</label><select id="f-h">'+HOMES.map(function(h){return '<option value="'+h[0]+'"'+(h[0]===(u.home===undefined?'':u.home)?' selected':'')+'>'+h[1]+' · '+h[2]+'</option>'}).join('')+'</select></div>'+
        '<div style="grid-column-start:1"><label class="f">'+B('Valid from','يبدأ')+'</label><input type="datetime-local" id="f-vf" value="'+esc(dt(u.validFrom))+'"></div>'+
        '<div><label class="f">'+B('Valid until','ينتهي')+'</label><input type="datetime-local" id="f-vt" value="'+esc(dt(u.validTo))+'"></div>'+
        (isNew?'<div><label class="f">'+B('Temporary password','كلمة مرور مؤقتة')+'</label><input id="f-p" type="password" class="ltr" autocomplete="new-password"></div>':'')+
        '</div><fieldset class="fs" style="margin-top:10px"><legend>'+B('Stations','المحطات')+'</legend>'+checks(STATIONS,u.stations,'f-st')+'</fieldset>'+
        '<fieldset class="fs" style="margin-top:10px"><legend>'+B('Extra pages','صفحات إضافية')+'</legend>'+checks(EXTRA,u.extraPages,'f-x')+'</fieldset>'+
        '<fieldset class="fs" style="margin-top:10px"><legend>'+B('Responsibilities','المسؤوليات')+'</legend>'+checks(RESP.map(function(r){return [r.code,r.en,r.ar]}),u.resps,'f-rs')+'</fieldset>'+
        '<div class="row" style="margin-top:12px"><button type="button" class="pri" id="f-save">'+B('Save','حفظ')+'</button><button type="button" id="f-close">'+B('Close','إغلاق')+'</button></div><div class="msg" id="f-m"></div>';
      (function(){var sel=d.querySelector('#f-w'),cur=u.ward||'',ww=d.querySelector('#f-ww'),rr=d.querySelector('#f-r');
        function vis(){ww.style.display=rr.value==='NURSE'?'':'none';if(rr.value!=='NURSE')sel.value='';}
        rr.addEventListener('change',vis);vis();
        google.script.run.withSuccessHandler(function(c){sel.innerHTML='<option value="">— بلا قسم ثابت · Any department —</option>'+c.hospitals.map(function(h){return '<optgroup label="'+esc(h.name)+'">'+h.depts.map(function(x){var v=h.key+'|'+x;return '<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'</optgroup>';}).join('');vis();}).getNursingConfig();
      })();
      d.querySelector('#f-close').onclick=function(){d.hidden=true};
      d.querySelector('#f-save').onclick=function(){
        var b=this,g=function(c){return [].slice.call(d.querySelectorAll('.'+c+':checked')).map(function(x){return x.value})};
        var data={ward:d.querySelector('#f-w').value,displayName:d.querySelector('#f-d').value,empRef:d.querySelector('#f-ref').value,sysRole:d.querySelector('#f-r').value,category:d.querySelector('#f-c').value,
          home:d.querySelector('#f-h').value,validFrom:d.querySelector('#f-vf').value,validTo:d.querySelector('#f-vt').value,stations:g('f-st'),extraPages:g('f-x'),resps:g('f-rs')};
        if(isNew){data.username=d.querySelector('#f-u').value.trim().toLowerCase();data.tempPassword=d.querySelector('#f-p').value;}
        b.disabled=true;
        (isNew?AuthGate.run('authAdminCreateUser',data):AuthGate.run('authAdminUpdateUser',u.id,data)).then(function(){b.disabled=false;d.hidden=true;OrgUI.msg(el.querySelector('#am'),B('Saved','تم الحفظ'),true);load();})
          .catch(function(e){b.disabled=false;OrgUI.msg(d.querySelector('#f-m'),OrgUI.err(e),false);});
      };
      d.scrollIntoView({behavior:'smooth',block:'start'});
    }
  }


  /* Organization: name and facilities/departments for the nursing page (no institution data in the code). */
  function organization(el){
    el.innerHTML='<div class="ou"><div class="panel"><h3>'+B('Organization','المنشأة')+'</h3><div class="empty">…</div></div></div>';
    AuthGate.run('orgGetProfile').then(function(p){
      var F=p.facilities.map(function(f){return {key:f.key,name:f.name,depts:f.depts.join('\n')};});
      function rows(){return F.map(function(f,i){return '<div class="panel" style="margin:10px 0 0;padding:12px" data-i="'+i+'"><div class="grid2">'+
        '<div><label class="f">'+B('Facility name','اسم المنشأة / المستشفى')+'</label><input type="text" data-f="name" value="'+esc(f.name)+'"></div>'+
        '<div><label class="f">'+B('Short code','الرمز المختصر')+'</label><input type="text" data-f="key" class="ltr" maxlength="8" value="'+esc(f.key)+'"></div></div>'+
        '<label class="f" style="margin-top:8px">'+B('Departments (one per line)','الأقسام (قسم في كل سطر)')+'</label><textarea data-f="depts" rows="6" class="ltr" style="width:100%;box-sizing:border-box;border:1px solid #d4d4d8;border-radius:10px;padding:8px;font-family:inherit">'+esc(f.depts)+'</textarea>'+
        '<div class="row" style="margin-top:8px"><button type="button" class="sm danger" data-del="'+i+'">'+B('Remove facility','حذف المنشأة')+'</button></div></div>';}).join('');}
      el.innerHTML='<div class="ou"><div class="panel"><h3>'+B('Organization','المنشأة')+'</h3>'+
        '<p style="color:var(--muted);font-size:13px;margin:0 0 12px">'+B('Shown in report headers. The facilities and departments below appear on the nursing page.','يظهر الاسم في رؤوس التقارير، وتظهر المنشآت وأقسامها في صفحة التمريض.')+'</p>'+
        '<div class="grid2"><div><label class="f">'+B('Name (Arabic)','الاسم بالعربية')+'</label><input type="text" id="o-ar" value="'+esc(p.nameAr)+'"></div>'+
        '<div><label class="f">'+B('Name (English)','الاسم بالإنجليزية')+'</label><input type="text" id="o-en" class="ltr" value="'+esc(p.nameEn)+'"></div></div>'+
        '<h3 style="margin-top:18px">'+B('Facilities & departments','المنشآت والأقسام')+'</h3><div id="o-f"></div>'+
        '<div class="row" style="margin-top:12px"><button type="button" class="sm" id="o-add">'+B('+ Facility','إضافة منشأة')+'</button><button type="button" class="pri" id="o-save">'+B('Save','حفظ')+'</button></div><div class="msg" id="o-msg"></div></div></div>';
      function sync(){el.querySelectorAll('[data-i]').forEach(function(box){var f=F[+box.dataset.i];box.querySelectorAll('[data-f]').forEach(function(i){f[i.dataset.f]=i.value;});});}
      function draw(){el.querySelector('#o-f').innerHTML=rows()||'<div class="empty">'+B('No facilities yet — the nursing page shows a notice until one is added.','لا توجد منشآت بعد، وستعرض صفحة التمريض تنبيهًا حتى تُضاف منشأة.')+'</div>';
        el.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){sync();F.splice(+b.dataset.del,1);draw();};});}
      draw();
      el.querySelector('#o-add').onclick=function(){sync();F.push({key:'',name:'',depts:''});draw();};
      el.querySelector('#o-save').onclick=function(){var b=this,m=el.querySelector('#o-msg');sync();b.disabled=true;
        AuthGate.run('orgSaveProfile',{nameAr:el.querySelector('#o-ar').value,nameEn:el.querySelector('#o-en').value,facilities:F.map(function(f){return {key:f.key,name:f.name,depts:f.depts.split('\n')};})})
          .then(function(r){b.disabled=false;F=r.facilities.map(function(f){return {key:f.key,name:f.name,depts:f.depts.join('\n')};});draw();OrgUI.msg(m,B('Saved','تم الحفظ'),true);})
          .catch(function(e){b.disabled=false;OrgUI.msg(m,OrgUI.err(e),false);});};
    }).catch(function(e){el.innerHTML='<div class="msg err">'+OrgUI.err(e)+'</div>';});
  }
  function categories(el){
    el.innerHTML='<div class="ou"><div class="panel"><h3>'+B('Supervisor categories','فئات المشرفين')+'</h3><div id="cl"></div>'+
      '<div class="row" style="margin-top:10px"><button type="button" id="ca">'+B('+ Add','إضافة')+'</button><button type="button" class="pri" id="cs">'+B('Save','حفظ')+'</button></div><div class="msg" id="cm"></div></div></div>';
    var list=[];
    AuthGate.run('orgOverview').then(function(d){list=d.categories;draw();});
    function draw(){el.querySelector('#cl').innerHTML=list.map(function(c,i){return '<div class="row" style="margin-bottom:6px" data-i="'+i+'"><input class="c-en ltr" placeholder="English" value="'+esc(c.en||'')+'" style="flex:1"><input class="c-ar" placeholder="العربية" value="'+esc(c.label)+'" style="flex:1"></div>'}).join('');}
    function read(){el.querySelectorAll('#cl [data-i]').forEach(function(r){var c=list[+r.dataset.i];c.en=r.querySelector('.c-en').value;c.label=r.querySelector('.c-ar').value;});}
    el.querySelector('#ca').onclick=function(){read();list.push({id:'',label:'',en:''});draw();};
    el.querySelector('#cs').onclick=function(){read();AuthGate.run('orgSaveCategories',list.filter(function(c){return c.label.trim()})).then(function(r){list=r;draw();OrgUI.msg(el.querySelector('#cm'),B('Saved','تم الحفظ'),true);})
      .catch(function(e){OrgUI.msg(el.querySelector('#cm'),OrgUI.err(e),false);});};
  }

  function audit(el){
    el.innerHTML='<div class="ou"><div class="panel"><input id="aq" placeholder="Filter · تصفية" style="width:100%;max-width:320px;margin-bottom:8px"><div style="overflow:auto;max-height:70vh"><table><thead><tr><th>Time</th><th>Event</th><th>Target</th><th>By</th><th>Detail</th><th>Outcome</th></tr></thead><tbody id="at"></tbody></table></div></div></div>';
    var rows=[];
    AuthGate.run('authAdminAudit',1000).then(function(r){rows=r;draw();});
    el.querySelector('#aq').oninput=draw;
    function draw(){var q=(el.querySelector('#aq').value||'').toLowerCase();
      el.querySelector('#at').innerHTML=rows.filter(function(r){return !q||r.join(' ').toLowerCase().indexOf(q)>-1}).slice(0,400).map(function(r){
        return '<tr class="ltr"><td style="white-space:nowrap">'+esc(new Date(r[0]).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'}))+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td title="'+esc(r[7]+' → '+r[8])+'">'+esc(r[4])+'</td><td><span class="tag '+(r[9]==='denied'?'t-bad':'t-ok')+'">'+esc(r[9]||'ok')+'</span></td></tr>';}).join('');}
  }

  AuthGate.start({accent:'#0a0a0a',bg:'#f4f4f5',barWidth:'1100px',page:'owner',allowBootstrap:true,onReady:function(){
    OrgUI.tabs(document.getElementById('main'),[
      {en:'Accounts',ar:'الحسابات',render:accounts},{en:'Monitoring',ar:'المتابعة',render:OrgUI.monitor},{en:'Task distribution',ar:'توزيع المهام',render:OrgUI.duty},
      {en:'Supervision',ar:'هيكل الإشراف',render:OrgUI.supervision},{en:'Categories',ar:'الفئات',render:categories},{en:'Organization',ar:'المنشأة',render:organization},{en:'Audit',ar:'السجل',render:audit}]);
  }});
})();
</script>
</body>
