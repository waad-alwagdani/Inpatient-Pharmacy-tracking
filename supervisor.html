        body.innerHTML = d.supervisors.length ? d.supervisors.map(function (s) {
          return '<div class="panel" data-s="' + esc(s.id) + '"><div class="row" style="justify-content:space-between"><h3 style="margin:0">' + esc(s.name) + ' <span class="ltr" style="color:#5b6472;font-weight:500">@' + esc(s.username) + '</span></h3>' +
            '<select class="s-cat" aria-label="category">' + catOpt(s.category) + '</select></div>' +
            '<label class="f" style="margin-top:10px">' + B('Employees', 'الموظفون') + '</label><div class="chips">' + d.employees.map(function (e) {
              return '<label class="chk"><input type="checkbox" value="' + esc(e.id) + '"' + (s.emps.indexOf(e.id) > -1 ? ' checked' : '') + ' class="s-emp">' + esc(e.name) + '</label>'; }).join('') + '</div>' +
            '<label class="f" style="margin-top:10px">' + B('Responsibilities overseen (none = all)', 'المسؤوليات تحت الإشراف (بلا تحديد = الكل)') + '</label><div class="chips">' + d.resps.map(function (r) {
              return '<label class="chk"><input type="checkbox" value="' + r.code + '"' + (s.scopeResps.indexOf(r.code) > -1 ? ' checked' : '') + ' class="s-resp">' + esc(r.en) + ' · ' + esc(r.ar) + '</label>'; }).join('') + '</div>' +
            '<div class="row" style="margin-top:10px"><button type="button" class="pri s-save">' + B('Save', 'حفظ') + '</button></div><div class="msg s-msg"></div></div>';
        }).join('') : '<div class="panel empty">' + B('No department supervisor accounts yet — the Owner creates them', 'لا حسابات لمشرفي الأقسام بعد — ينشئها المالك') + '</div>';
        body.insertAdjacentHTML('beforeend', respPanel); bindResp();
        if (flash) { var fp = body.querySelector('[data-s="' + flash + '"] .s-msg'); if (fp) msg(fp, B('Saved', 'تم الحفظ'), true); flash = null; }
        body.querySelectorAll('[data-s]').forEach(function (p) {
          p.querySelector('.s-save').onclick = function () {
            var b = this; b.disabled = true;
            var emps = [].slice.call(p.querySelectorAll('.s-emp:checked')).map(function (x) { return x.value; });
            var resps = [].slice.call(p.querySelectorAll('.s-resp:checked')).map(function (x) { return x.value; });
            AuthGate.run('orgSetSupervision', p.dataset.s, emps, resps, p.querySelector('.s-cat').value).then(function () { b.disabled = false; flash = p.dataset.s; load(); })
              .catch(function (e) { b.disabled = false; msg(p.querySelector('.s-msg'), err(e), false); });
          };
        });
      }).catch(function (e) { el.querySelector('.s-body').innerHTML = '<div class="panel msg err">' + err(e) + '</div>'; });
    }
  }

  /* ---------------- Tabs helper ---------------- */
  function tabs(host, list) {
    host.innerHTML = '<div class="ou"><div class="ou-tabs" role="tablist" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' + list.map(function (t, i) {

    }).join('') + '</div><div class="ou-pane"></div></div>';
    var pane = host.querySelector('.ou-pane'), btns = host.querySelectorAll('[data-t]');

    btns.forEach(function (b) { b.onclick = function () { show(+b.dataset.t); }; });
    show(0);
  }

  return { B: B, esc: esc, err: err, msg: msg, monitor: monitor, duty: duty, roster: duty, supervision: supervision, tabs: tabs, iso: iso, loadLib: loadLib };
})();
</script>

<script>
/* OosUI.panel(host, page) — page: 'pack' (unit dose) · 'inventory' (other items) · 'supervisor' (both, with type) */
var OosUI = (function () {
  var ST = { Open: ['جديد', 'New'], Refilling: ['جاري التعبئة', 'Refilling'], Refilled: ['تم التعبئة', 'Refilled'], Unavailable: ['الصنف غير متوفر', 'Unavailable'] };
  var GR = { 'Unit Dose': ['وحدة جرعية', 'Unit dose'], 'Other': ['أصناف الصيدلية', 'Pharmacy item'] };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function panel(host, page) {
    var D = [], F = 'open', G = '', timer = null;
    host.innerHTML = '<div class="oos-k" style="color:#6b6862">Loading · جاري التحميل…</div>';
    function load() { return AuthGate.run('oosAlerts', page).then(function (d) { D = d.rows; draw(); }, function (e) { host.innerHTML = '<div class="oos-m">تعذّر تحميل البلاغات · Could not load alerts</div>'; }); }
    function draw() {
      if (!document.body.contains(host)) { clearInterval(timer); return; }
      var rows = D.filter(function (r) { return !G || r.group === G; });
      var cnt = function (s) { return rows.filter(function (r) { return r.status === s; }).length; };
      var open = function (r) { return r.status === 'Open' || r.status === 'Refilling'; };
      var list = rows.filter(function (r) { return F === 'all' || (F === 'open' ? open(r) : !open(r)); });
      if (F === 'open') list.sort(function (a, b) { return a.t - b.t; });
      var h = '<div class="oos-k"><div><b style="color:#b91c1c">' + cnt('Open') + '</b><span>بلاغ جديد · New</span></div><div><b style="color:#a16207">' + cnt('Refilling') + '</b><span>جاري التعبئة · Refilling</span></div>' +
        '<div><b style="color:#15803d">' + cnt('Refilled') + '</b><span>تم التعبئة · Refilled</span></div><div><b>' + cnt('Unavailable') + '</b><span>غير متوفر · Unavailable</span></div></div>';
      h += '<div class="oos-f"><label>الحالة · Status <select data-f>' + [['open', 'المفتوحة · Open'], ['done', 'المغلقة · Closed'], ['all', 'الكل · All']].map(function (f) { return '<option value="' + f[0] + '"' + (F === f[0] ? ' selected' : '') + '>' + f[1] + '</option>'; }).join('') + '</select></label>';
      if (page === 'supervisor') h += '<label>النوع · Type <select data-g>' + [['', 'الكل · All'], ['Unit Dose', 'وحدة جرعية · Unit dose'], ['Other', 'أصناف الصيدلية · Pharmacy items']].map(function (g) { return '<option value="' + g[0] + '"' + (G === g[0] ? ' selected' : '') + '>' + g[1] + '</option>'; }).join('') + '</select></label>';
      h += '<button type="button" data-r="1" style="margin-inline-start:auto">↻ تحديث · Refresh</button></div>';
      h += list.length ? list.map(function (r) {
        var s = ST[r.status] || ST.Open, g = GR[r.group] || [r.group, r.group];
        return '<div class="oos-c ' + (r.status === 'Open' ? 'open' : r.status === 'Refilling' ? 'prog' : '') + '"><div class="top"><div><div class="nm">' + esc(r.name) + ' <span style="font-weight:500;color:#6b6862">' + esc(r.strength) + '</span></div>' +
          '<div class="meta">' + (page === 'supervisor' ? '<span class="oos-p g">' + g[0] + ' · ' + g[1] + '</span>' : '') + '#' + esc(r.no) + ' · ' + esc(r.at) + (r.dept ? ' · ' + esc(r.dept) : '') + (r.by ? ' · ' + esc(r.by) : '') + '</div>' +
          (r.note ? '<div class="meta">ملاحظة · Note: ' + esc(r.note) + '</div>' : '') + (r.handler ? '<div class="meta">' + esc(r.handler) + ' · ' + esc(r.updated) + '</div>' : '') + '</div>' +
          '<span class="oos-p ' + esc(r.status) + '">' + s[0] + ' · ' + s[1] + '</span></div>' +
          (open(r) ? '<div class="oos-a" data-row="' + r.row + '">' + (r.status === 'Open' ? '<button type="button" data-s="Refilling">جاري التعبئة · Refilling</button>' : '') +
            '<button type="button" class="pri" data-s="Refilled">تم التعبئة · Refilled</button><button type="button" data-s="Unavailable">الصنف غير متوفر · Unavailable</button></div><div class="oos-m"></div>' : '') + '</div>';
      }).join('') : '<div class="oos-c" style="color:#6b6862">لا توجد بلاغات · No alerts</div>';
      host.innerHTML = h;
      host.querySelector('select[data-f]').onchange = function () { F = this.value; draw(); };
      var sg = host.querySelector('select[data-g]'); if (sg) sg.onchange = function () { G = this.value; draw(); };
      host.querySelector('[data-r]').onclick = load;
      host.querySelectorAll('.oos-a [data-s]').forEach(function (b) { b.onclick = function () {
        var box = b.parentNode, m = box.nextElementSibling; box.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
        AuthGate.run('oosRespond', page, Number(box.dataset.row), b.dataset.s).then(load, function (e) {
          box.querySelectorAll('button').forEach(function (x) { x.disabled = false; }); m.textContent = /FORBIDDEN/.test(String(e && e.message)) ? 'لا صلاحية · Not allowed' : 'تعذّر الحفظ · Not saved';
        });
      }; });
    }
    load(); timer = setInterval(function () { if (!document.hidden) load(); }, 60000);
  }
  return { panel: panel };
})();
</script>

<script>
var QualityUI=(function(){
  /* official A4 report shell (print / save as PDF) */
  var RCSS="@page{size:A4 portrait;margin:15mm}*{box-sizing:border-box}body{margin:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n.report-container{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color:#1E293B;background:#FFFFFF;max-width:210mm;margin:0 auto;padding:24px;direction:rtl}\n.report-header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0F172A;padding-bottom:16px;margin-bottom:24px;gap:16px}\n.report-title h1{font-size:20px;font-weight:800;color:#0F172A;margin:0 0 4px 0}.report-title div{font-size:12px;color:#475569}\n.report-meta-box{background:#F8FAFC;border:1px solid #CBD5E1;border-radius:8px;padding:8px 14px;font-size:12px;text-align:left;direction:ltr;line-height:1.6;white-space:nowrap}\n.report-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}\n.kpi-card{background:#F8FAFC;border:1px solid #E2E8F0;border-top:4px solid #334155;border-radius:8px;padding:14px;text-align:right}\n.kpi-card.warning{border-top-color:#D97706}.kpi-card.success{border-top-color:#059669}.kpi-card.danger{border-top-color:#DC2626}\n.kpi-card .number{font-size:26px;font-weight:800;color:#0F172A;line-height:1.2}.kpi-card .label{font-size:12px;color:#475569;margin-top:6px;font-weight:600}\n.analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px}\n.analysis-box{border:1px solid #E2E8F0;border-radius:8px;padding:12px 16px;min-height:95px;background:#FFFFFF;break-inside:avoid}\n.analysis-box h3{font-size:13px;font-weight:700;color:#0F172A;border-bottom:1px solid #F1F5F9;padding-bottom:8px;margin:0 0 10px 0;display:flex;justify-content:space-between}\n.analysis-box .row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}.analysis-box .bar{height:6px;background:#F1F5F9;border-radius:99px;margin:2px 0 6px}.analysis-box .bar i{display:block;height:6px;border-radius:99px;background:#334155}\n.empty-state{font-size:12px;color:#94A3B8;text-align:center;padding:16px 0}\nh2.sec{font-size:14px;font-weight:700;color:#0F172A;margin:0 0 10px}\n.report-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:30px}\n.report-table th{background:#0F172A;color:#FFFFFF;font-weight:600;padding:10px 8px;text-align:right;border:1px solid #0F172A}\n.report-table td{padding:10px 8px;border:1px solid #CBD5E1;color:#334155;vertical-align:top}.report-table tr:nth-child(even){background:#F8FAFC}\n.report-table thead{display:table-header-group}.report-table tr{break-inside:avoid}\n.sign{display:flex;justify-content:space-between;gap:30px;margin-top:36px;font-size:12px;color:#334155}.sign div{flex:1;border-top:1px solid #94A3B8;padding-top:8px}\n.report-footer{border-top:1px solid #CBD5E1;padding-top:12px;margin-top:40px;display:flex;justify-content:space-between;font-size:11px;color:#64748B}";
  function rptOpen(title,metaHtml,body){var w=window.open('','_blank');if(!w)return;var now=new Date().toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});
    w.document.write('<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>'+OrgUI.esc(title)+'</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"><style>'+RCSS+'</style></head><body><div class="report-container">'+
      '<div class="report-header"><div class="report-title"><h1>'+OrgUI.esc(title)+'</h1><div>إدارة الصيدلية · قسم الجودة</div></div><div class="report-meta-box">'+metaHtml+'</div></div>'+body+
      '<div class="report-footer"><span>Pharmacy Tracker by WaadAlwagdani</span><span>أُعدّ في '+now+'</span></div></div><script>onload=function(){setTimeout(function(){print()},300)}<\/script></body></html>');w.document.close();}
  /* varied visuals for the A4 report (print-friendly SVG / CSS, no libraries) */
  function rptDonut(t,L){var g=[['A–B','وشيك / لم يصل','#2563EB',/^[AB]$/],['C–D','وصل بلا ضرر','#D97706',/^[CD]$/],['E–I','مع ضرر','#DC2626',/^[E-I]$/]];
    var c=g.map(function(x){return L.filter(function(r){return x[3].test(r['Severity (NCC MERP)']);}).length;}),un=L.length-c[0]-c[1]-c[2],tot=L.length;
    var R=42,C=2*Math.PI*R,off=0,arcs=c.map(function(v,i){if(!v||!tot)return '';var len=v/tot*C,a='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+g[i][2]+'" stroke-width="16" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"/>';off+=len;return a;}).join('');
    var svg='<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="'+R+'" fill="none" stroke="#F1F5F9" stroke-width="16"/>'+arcs+'<text x="60" y="58" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A">'+tot+'</text><text x="60" y="76" text-anchor="middle" font-size="10" fill="#64748B">بلاغ</text></svg>';
    var leg=g.map(function(x,i){return '<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;margin:4px 0"><i style="width:10px;height:10px;border-radius:3px;background:'+x[2]+';display:inline-block"></i><span style="flex:1">'+x[0]+' · '+x[1]+'</span><b>'+c[i]+'</b></div>';}).join('')+(un?'<div style="font-size:11px;color:#94A3B8;margin-top:4px">غير مصنّف بعد: '+un+'</div>':'');
    return '<div class="analysis-box"><h3><span>'+t+'</span><span>'+tot+'</span></h3><div style="display:flex;align-items:center;gap:14px">'+svg+'<div style="flex:1">'+leg+'</div></div></div>';}
  function rptFlow(t,L){var st=['Prescribing','Transcribing','Preparing','Dispensing','Administration','Monitoring'],AR={Prescribing:'الوصف',Transcribing:'النسخ',Preparing:'التحضير',Dispensing:'الصرف',Administration:'الإعطاء',Monitoring:'المتابعة'};
    var c=st.map(function(x){return L.filter(function(r){return r['Process Stage']===x;}).length;}),mx=Math.max.apply(null,c),tot=L.length||1;
    return '<div class="analysis-box"><h3><span>'+t+'</span><span>'+L.length+'</span></h3><div style="display:flex;align-items:stretch;gap:4px;direction:rtl">'+st.map(function(x,i){var top=c[i]&&c[i]===mx;
      return (i?'<div style="align-self:center;color:#CBD5E1;font-size:12px">‹</div>':'')+'<div style="flex:1;border:1px solid #E2E8F0;border-top:3px solid '+(top?'#2563EB':'#E2E8F0')+';border-radius:6px;padding:6px 2px;text-align:center;background:'+(top?'#EFF6FF':'#fff')+'"><div style="font-size:10px;color:#475569;font-weight:600">'+AR[x]+'</div><div style="font-size:16px;font-weight:800;color:#0F172A">'+c[i]+'</div><div style="font-size:9.5px;color:#64748B">'+Math.round(c[i]/tot*100)+'%</div></div>';}).join('')+'</div></div>';}
  function rptRank(t,L,key){var c={};L.forEach(function(r){var x=r[key]||'—';c[x]=(c[x]||0)+1;});var k=Object.keys(c).sort(function(a,b){return c[b]-c[a];}).slice(0,5),tot=L.length||1;
    return '<div class="analysis-box"><h3><span>'+t+'</span><span>Top 5</span></h3>'+(k.length?k.map(function(x,i){var pc=Math.round(c[x]/tot*100);return '<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><span style="width:20px;height:20px;border-radius:50%;background:'+(i?'#F1F5F9':'#0F172A')+';color:'+(i?'#0F172A':'#fff')+';font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none">'+(i+1)+'</span><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:11.5px"><span dir="ltr" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+OrgUI.esc(x)+'</span><b>'+c[x]+' · '+pc+'%</b></div><div style="height:4px;background:#F1F5F9;border-radius:99px;margin-top:3px"><div style="height:4px;border-radius:99px;background:#334155;width:'+pc+'%"></div></div></div></div>';}).join(''):'<div class="empty-state">لا توجد بيانات</div>')+'</div>';}
  function rptUnits(t,L){var c={};L.forEach(function(r){var x=r['Location / Unit']||'—';c[x]=(c[x]||0)+1;});var k=Object.keys(c).sort(function(a,b){return c[b]-c[a];});

  function expiry(el){
    var E=OrgUI.esc;
    el.innerHTML='<div style="color:#71717a;padding:20px">Loading · جاري التحميل</div>';
    function draw(d,msg){
      var opts='';for(var i=1;i<=28;i++)opts+='<option value="'+i+'"'+(d.day===i?' selected':'')+'>'+i+'</option>';
      var cnt=function(k){return d.rows.filter(function(r){return r.band===k;}).length;};
      var by={};d.bands.forEach(function(b){by[b.k]=b;});
      el.innerHTML='<div style="background:var(--pt-card,#fff);border:1px solid #e4e4e7;border-radius:10px;padding:14px;margin-bottom:12px">'+
        '<div style="font-weight:700;margin-bottom:8px">Automatic report day · يوم التجهيز التلقائي</div>'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-size:13px">Day of month · يوم الشهر</span>'+
        '<select id="xd" style="height:36px;border:1px solid #e4e4e7;border-radius:8px;padding:0 10px;font:inherit"><option value="">—</option>'+opts+'</select>'+
        '<button id="xs" type="button" style="height:36px;padding:0 14px;border:0;border-radius:8px;background:#0a0a0a;color:#fff;font:600 13px inherit;font-family:inherit;cursor:pointer">Save · حفظ</button>'+
        '<button id="xr" type="button" style="height:36px;padding:0 14px;border:1px solid #0a0a0a;border-radius:8px;background:var(--pt-card,#fff);color:#0a0a0a;font:600 13px inherit;font-family:inherit;cursor:pointer">Prepare now · تجهيز الآن</button></div>'+
        '<div style="font-size:12px;color:#71717a;margin-top:8px">'+(d.day?'يُجهَّز التقرير تلقائيًا يوم '+d.day+' من كل شهر في تبويب «تقرير الانتهاء» في الجدول.':'لم يُحدَّد يوم بعد.')+(d.last?' · آخر تجهيز: <span dir="ltr">'+E(d.last)+'</span>':'')+'</div>'+
        '<div id="xm" role="status" style="font-size:13px;margin-top:6px">'+(msg||'')+'</div></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">'+d.bands.map(function(b){return '<div style="flex:1;min-width:130px;background:'+b.bg+';color:'+b.fg+';border-radius:8px;padding:10px 12px"><div style="font-size:22px;font-weight:700">'+cnt(b.k)+'</div><div style="font-size:12px">'+E(b.en)+' · '+E(b.ar)+'</div></div>';}).join('')+'</div>'+
        '<div style="background:var(--pt-card,#fff);border:1px solid #e4e4e7;border-radius:10px;overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;direction:ltr">'+
        '<tr style="background:#f4f4f5">'+['Item · الصنف','Strength','Lot · التشغيلة','Expiry · الانتهاء','Qty · الكمية','Days · الأيام'].map(function(h){return '<th style="text-align:left;padding:8px">'+h+'</th>';}).join('')+'</tr>'+
        (d.rows.length?d.rows.map(function(r){var b=by[r.band];return '<tr style="background:'+b.bg+';color:'+b.fg+'"><td style="padding:7px 8px;font-weight:600">'+E(r.name)+'</td><td style="padding:7px 8px">'+E(r.strength)+'</td><td style="padding:7px 8px">'+E(r.lot)+'</td><td style="padding:7px 8px">'+E(r.exp)+'</td><td style="padding:7px 8px">'+r.qty+'</td><td style="padding:7px 8px">'+r.days+'</td></tr>';}).join('')
          :'<tr><td colspan="6" style="padding:16px;text-align:center;color:#71717a">لا توجد تشغيلات في المخزون</td></tr>')+'</table></div>';
      el.querySelector('#xs').onclick=function(){var v=el.querySelector('#xd').value;if(!v){el.querySelector('#xm').textContent='يُرجى اختيار اليوم';return;}
        AuthGate.run('exprSave',v).then(function(){d.day=+v;draw(d,'تم الحفظ ✓');},function(e){el.querySelector('#xm').textContent=OrgUI.err(e);});};
      el.querySelector('#xr').onclick=function(){el.querySelector('#xm').textContent='جاري التجهيز…';
        AuthGate.run('exprRunNow').then(function(r){d.last=r.last;d.rows=r.rows;draw(d,'تم تجهيز التقرير في الجدول ✓');},function(e){el.querySelector('#xm').textContent=OrgUI.err(e);});};
    }
    AuthGate.run('exprGet').then(function(d){draw(d);},function(e){el.innerHTML='<div style="color:#a3231b;padding:20px">'+OrgUI.esc(OrgUI.err(e))+'</div>';});
  }

  // Re-packaging stock — same figures the re-packer sees (Pharmacy Tracker by WaadAlwagdani)
  function pstock(el){
    var E=OrgUI.esc,Q='',F='all',D=null,C={red:['#dc2626','#fef2f2','Step in now · يلزم التغليف الآن'],amber:['#ca8a04','#fefce8','Soon · قريبًا'],green:['#16a34a','#f0fdf4','Enough · كافٍ']};
    function load(){ if(!D) el.innerHTML='<div style="color:#71717a;padding:20px">Loading · جاري التحميل</div>';
      AuthGate.run('packStock').then(function(d){D=d;draw();},function(e){el.innerHTML='<div style="color:#a3231b;padding:20px">'+E(OrgUI.err(e))+'</div>';}); }
    function draw(){
      var n={red:0,amber:0,green:0};D.items.forEach(function(x){n[x.st]++;});
      var q=Q.toLowerCase(),rows=D.items.filter(function(x){return(F==='all'||x.st===F)&&(!q||(x.name+' '+x.strength+' '+x.no).toLowerCase().indexOf(q)>-1);});
      el.innerHTML='<div style="background:var(--pt-card,#fff);border:1px solid #e4e4e7;border-radius:12px;padding:14px">'+
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">'+['red','amber','green'].map(function(k){return '<button type="button" class="sf" data-f="'+k+'" style="flex:1;min-width:150px;height:auto!important;min-height:72px;line-height:1.3;display:block;text-align:start;border:2px solid '+(F===k?C[k][0]:'transparent')+';background:'+C[k][1]+';border-radius:10px;padding:10px 12px;cursor:pointer;font-family:inherit"><div style="font-size:24px;font-weight:700;color:'+C[k][0]+'">'+n[k]+'</div><div style="font-size:12px;font-weight:600">'+C[k][2]+'</div></button>';}).join('')+'</div>'+
        '<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"><input type="search" class="sq" value="'+E(Q)+'" placeholder="بحث بالصنف · Search item" style="flex:1;min-width:220px;height:38px;border:1px solid #d4d4d8;border-radius:8px;padding:0 12px;font:inherit">'+
        '<button type="button" class="sr" style="height:38px;border:0;background:#0a0a0a;color:#fff;border-radius:8px;padding:0 14px;cursor:pointer;font-family:inherit;font-weight:600">Refresh · تحديث</button></div>'+
        '<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;direction:ltr"><tr style="background:#f4f4f5">'+
        ['Item · الصنف','Packed · المغلّف','Dispensed · المصروف','Left · المتبقي','Today · اليوم','Avg/day · المعدل','Days left · يكفي','Last packed · آخر تغليف'].map(function(h,i){return '<th style="padding:8px;text-align:'+(i?'center':'left')+';white-space:nowrap">'+h+'</th>';}).join('')+'</tr>'+
        (rows.length?rows.map(function(x){var c=C[x.st];return '<tr style="border-top:1px solid #e4e4e7"><td style="padding:8px;border-left:4px solid '+c[0]+'"><b>'+E(x.name)+'</b> <span style="color:#71717a">'+E(x.strength)+'</span></td><td style="text-align:center">'+x.packed+'</td><td style="text-align:center">'+x.wd+'</td><td style="text-align:center;font-weight:700;color:'+c[0]+'">'+x.bal+'</td><td style="text-align:center">'+x.wdToday+'</td><td style="text-align:center">'+x.avg+'</td><td style="text-align:center;font-weight:600">'+(x.cover===null?'—':x.cover)+'</td><td style="text-align:center;color:#71717a">'+(x.lastPack||'—')+'</td></tr>';}).join(''):'<tr><td colspan="8" style="padding:16px;text-align:center;color:#71717a">لا توجد أصناف مطابقة</td></tr>')+
        '</table></div><div style="font-size:12px;color:#71717a;margin-top:8px">آخر تحديث: <span dir="ltr">'+E(D.at)+'</span></div></div>';
      el.querySelectorAll('.sf').forEach(function(b){b.onclick=function(){F=F===b.dataset.f?'all':b.dataset.f;draw();};});
      el.querySelector('.sr').onclick=load;
      var i=el.querySelector('.sq');i.oninput=function(){Q=this.value;var pos=this.selectionStart;draw();var j=el.querySelector('.sq');j.focus();try{j.setSelectionRange(pos,pos);}catch(e){}};
    }
    load();
  }
  AuthGate.start({accent:'#0a0a0a',bg:'#f4f4f5',barWidth:'980px',page:'supervisor',onReady:function(u){
    var tabs=[{en:'Monitoring',ar:'المتابعة',render:OrgUI.monitor},{en:'Task distribution',ar:'توزيع المهام',render:OrgUI.duty},
      {en:u.sysRole==='DEPT_SUPERVISOR'?'My team':'Supervision',ar:u.sysRole==='DEPT_SUPERVISOR'?'فريقي':'هيكل الإشراف',render:OrgUI.supervision}];
    if(u.sysRole==='OWNER'||u.sysRole==='PHARMACY_SUPERVISOR'||u.sysRole==='QUALITY') tabs.push({en:'Expiry report',ar:'تقرير الانتهاء',render:expiry});
    tabs.push({en:'Re-packaging stock',ar:'رصيد إعادة التغليف',render:pstock});
    tabs.push({en:'OOS alerts',ar:'بلاغات عدم التوفر',render:function(el){OosUI.panel(el,'supervisor');}});
    if(u.sysRole==='OWNER'||u.sysRole==='PHARMACY_SUPERVISOR') tabs.push({en:'Quality sheet',ar:'ورقة الجودة',render:QualityUI.qualitySheet});
    OrgUI.tabs(document.getElementById('main'),tabs);
  }});
</script>
